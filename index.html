  state[key].selected = selectedIdsFromKeysFor(DOMAINS[key], state[key].selectedKeys || new Set());
}
function selectedKeysForComponent(d,componentId){
  const c=d.components?.[componentId];
  return c ? c.ids.map(id=>ingredientKey(c.module,id)).filter(k=>d.ingredients[k.split('::')[1]]) : [];
}
function occurrenceKeysForIdsInDomain(d,ids){
  const keys=[];
  unique(ids||[]).forEach(id=>{
    Object.keys(d.modules||{}).forEach(mid=>{
      const direct=(d.modules[mid]?.sections||[]).some(sec=>(sec.ids||[]).includes(id));
      if(direct) keys.push(ingredientKey(mid,id));
    });
  });
  // Fallback: when an ingredient is only brought in through a component, use the ingredient's declared modules.
  unique(ids||[]).forEach(id=>{
    if(keys.some(k=>k.endsWith(`::${id}`))) return;
    (d.ingredients[id]?.modules||[]).forEach(mid=>keys.push(ingredientKey(mid,id)));
  });
  return unique(keys);
}
function presetOccurrenceKeysFor(d,p){return p?.keys?.length ? p.keys.filter(k=>{const [mid,id]=String(k).split('::'); return d.modules?.[mid] && d.ingredients?.[id];}) : occurrenceKeysForIdsInDomain(d,p?.ids||[]);}
function isKeySelected(key){return st().selectedKeys?.has(key);}
function selectedInModule(moduleId){
  const out=[];
  const seen=new Set();
  (st().selectedKeys||new Set()).forEach(key=>{
    const [mid,id]=String(key).split('::');
    if(mid===moduleId && item(id) && !seen.has(id)){seen.add(id); out.push(id);}
  });
  return out;
}
function has(id){return st().selected.has(id);}
function hasAny(ids){return ids.some(has);}
function selectedPresetExact(){

  return domain().presets.find(p=>setEq(selectedIds,new Set(p.ids)) && setEq(s.methods,new Set(p.methods||[])));
}
function presetById(id){return domain().presets.find(p=>p.id===id);} 

function componentGroupKeyFor(d,componentId){
  const c=d.components?.[componentId];
  if(!c) return '';
  const m=d.modules?.[c.module];
  for(let i=0;i<(m?.sections||[]).length;i++){
    const sec=m.sections[i];
    if((sec.components||[]).includes(componentId)) return `${c.module}::${i}`;
  }

}
function componentGroupKey(componentId){return componentGroupKeyFor(domain(),componentId);}
function componentGroupComponentIdsFor(d,groupKey){
  if(!groupKey) return [];
  const [moduleId,idxRaw]=groupKey.split('::');
  const m=d.modules?.[moduleId];
  if(idxRaw==='__ungrouped') return Object.values(d.components||{}).filter(c=>c.module===moduleId && !((m?.sections||[]).some(sec=>(sec.components||[]).includes(c.id)))).map(c=>c.id);
  const sec=(m?.sections||[])[Number(idxRaw)];
  return (sec?.components||[]).filter(cid=>d.components?.[cid]);

function componentGroupEntriesFor(d){

    const key=componentGroupKeyFor(d,cid);
    if(key && !groups.some(g=>g.key===key)) groups.push({key, componentIds:componentGroupComponentIdsFor(d,key)});
  });
  return groups;
}
function componentKeySetFor(d,componentId){return new Set(selectedKeysForComponent(d,componentId));}
function bestComponentForSelectionInGroup(d,groupKey,selectedKeys){
  const keySet=selectedKeys || new Set();
  const ids=componentGroupComponentIdsFor(d,groupKey);
  return ids
    .map(cid=>d.components[cid])
    .filter(c=>c && selectedKeysForComponent(d,c.id).every(k=>keySet.has(k)))
    .sort((a,b)=>b.ids.length-a.ids.length || a.label.localeCompare(b.label))[0]?.id || null;
}
function inferComponentMapFromKeysFor(d,selectedKeys){

    if(best) out[g.key]=best;

function componentStatus(id){

  const keys=selectedKeysForComponent(domain(),id);

  if(explicit===id && keys.some(k=>st().selectedKeys.has(k))) return 'partial';

function componentActive(id){return componentStatus(id)==='active';}

function pruneComponentGroups(){

    const cid=st().components[g];
    if(!cid || !selectedKeysForComponent(domain(),cid).every(k=>st().selectedKeys.has(k))) delete st().components[g];

function clearComponentGroup(groupKey,keepComponentId=null,previousComponentId=null){
  const removeComponentIds=previousComponentId?[previousComponentId]:componentGroupComponentIds(groupKey).filter(cid=>cid!==keepComponentId);
  removeComponentIds.forEach(cid=>selectedKeysForComponent(domain(),cid).forEach(k=>st().selectedKeys.delete(k)));

function clearModuleSelection(moduleId){

function setSelected(ids,methods=[]){
  const d=domain();
  const p = d.presets.find(p=>setEq(new Set(p.ids),new Set(ids)) && setEq(new Set(p.methods||[]),new Set(methods||[])));
  const keys = p ? presetOccurrenceKeysFor(d,p) : occurrenceKeysForIdsInDomain(d,ids);
  st().selectedKeys = new Set(keys);
  syncSelectedIdsForDomain();
  st().methods = new Set((methods||[]).filter(id=>d.methods.some(m=>m.id===id)));

function applyPreset(id){const p=presetById(id); if(!p)return; setSelected(p.ids,p.methods); st().basePreset=id; save(); renderAll();}
function toggleIngredient(id,moduleId=null){
  const mid=moduleId || (item(id)?.modules||[])[0];
  const key=ingredientKey(mid,id);
  if(st().selectedKeys.has(key)) st().selectedKeys.delete(key); else st().selectedKeys.add(key);
  syncSelectedIdsForDomain();
  pruneComponentGroups();
  save(); renderAll();
}
function toggleMethod(id){if(st().methods.has(id)) st().methods.delete(id); else st().methods.add(id); save(); renderAll();}
function toggleComponent(id){
  const c=comp(id); if(!c)return;
  const groupKey=componentGroupKey(id);
  const current=activeComponentForGroup(groupKey);
  const keys=selectedKeysForComponent(domain(),id);
  const active=current===id && keys.every(k=>st().selectedKeys.has(k));
  clearComponentGroup(groupKey,active?null:id,current && current!==id?current:null);
  if(active){delete st().components[groupKey];}
  else{keys.forEach(k=>st().selectedKeys.add(k)); st().components[groupKey]=id;}
  syncSelectedIdsForDomain();

  st().basePreset=selectedPresetExact()?.id || st().basePreset;

function save(){
  if(currentDomain)localStorage.setItem('cookingBuilder.domain',currentDomain);
  const out={};
  for(const [k,v] of Object.entries(state)){
    out[k]={selected:[...(v.selected||[])],selectedKeys:[...(v.selectedKeys||[])],methods:[...v.methods],basePreset:v.basePreset,components:v.components||{}};
  }
  localStorage.setItem('cookingBuilder.state',JSON.stringify(out));
}
function load(){
  try{
    const raw=JSON.parse(localStorage.getItem('cookingBuilder.state')||'{}');
    for(const k of Object.keys(DOMAINS)){
      if(raw[k]){
        state[k].selectedKeys=new Set(raw[k].selectedKeys||[]);
        if(!state[k].selectedKeys.size && raw[k].selected) state[k].selectedKeys=new Set(occurrenceKeysForIdsInDomain(DOMAINS[k],raw[k].selected));
        state[k].selected=selectedIdsFromKeysFor(DOMAINS[k],state[k].selectedKeys);
        state[k].methods=new Set(raw[k].methods||[]);
        state[k].basePreset=raw[k].basePreset||null;
        state[k].components=raw[k].components||inferComponentMapFromKeysFor(DOMAINS[k],state[k].selectedKeys);
      }
    }
  }catch(e){}
  for(const [key,d] of Object.entries(DOMAINS)){
    if(!state[key].selectedKeys.size && d.defaultPreset) applyPresetNoRender(d.defaultPreset,key);
    syncSelectedIdsForDomain(key);
    if(!state[key].components) state[key].components=inferComponentMapFromKeysFor(d,state[key].selectedKeys);
  }
}
function applyPresetNoRender(id,key){
  const d=DOMAINS[key], s=state[key], p=d.presets.find(x=>x.id===id);
  if(p){s.selectedKeys=new Set(presetOccurrenceKeysFor(d,p)); s.selected=selectedIdsFromKeysFor(d,s.selectedKeys); s.methods=new Set(p.methods||[]); s.basePreset=id; s.components=inferComponentMapFromKeysFor(d,s.selectedKeys);}
}

function stirfryInstructions(){const prep=[],cook=[]; const protein=selectedInModule('protein'), treatment=selectedInModule('treatment'), sauce=selectedInModule('sauce'), veg=selectedInModule('veg'), arom=selectedInModule('aromatics'), finish=selectedInModule('finish'), base=selectedInModule('base');
 if(protein.length)prep.push(block('Protein prep',protein,[`Prep ${bs(protein)} into small, even pieces.`, has('tofu')?'Press tofu and cube it before coating.':'Slice meat thinly across the grain where relevant.']));
 if(treatment.length)prep.push(block('Velvet / marinade',treatment,[`Mix the treatment ingredients: ${bs(treatment)}.`, 'Coat protein lightly; too much baking soda or starch will make the texture weird.']));
 if(sauce.length)prep.push(block('Sauce bowl',sauce,[`Mix the sauce ingredients: ${bs(sauce)}.`, has('cornstarchSlurry')?'Keep slurry smooth and add near the end so it thickens without clumping.':'Hold sauce until vegetables and protein are nearly done.']));
 if(veg.length||arom.length)prep.push(block('Vegetables and aromatics',[...veg,...arom],[`Cut vegetables and aromatics: ${bs([...veg,...arom])}.`, 'Group hard vegetables, quick vegetables, and aromatics separately so timing stays clean.']));
 cook.push(block('Cook sequence',[...protein,...veg,...sauce],[st().methods.has('batchCook')?'Cook protein in batches and remove it before vegetables.':'Cook protein first, then move quickly into vegetables.', veg.length?`Stir-fry vegetables in timing order: hardest first, greens late.`:'Add vegetables if using them.', arom.length?`Add aromatics like ${bs(arom)} briefly before sauce so they bloom without burning.`:'', sauce.length?'Return protein, add sauce, and toss until glossy.':'Season in the pan and keep it dry-hot.'] .filter(Boolean)));
 cook.push(block('Finish and serve',[...finish,...base],[base.length?`Serve over ${bs(base)}.`:'Serve immediately; choose rice or noodles if needed.', finish.length?`Finish with ${bs(finish)} off heat or just before plating.`:'Add a final acid/crunch if the bowl tastes flat.']));
 return `<div class="instruction-stack">${prep.join('')}${cook.join('')}</div>`;}


function burgerInstructions(){
  const prep=[],cook=[];
  const patty=selectedInModule('patty'), cheese=selectedInModule('cheese'), bread=selectedInModule('bread'), sauce=selectedInModule('sauce'), cooked=selectedInModule('cookedToppings'), fresh=selectedInModule('freshToppings');
  const specialSauce=sauce.filter(id=>!['ketchup','yellowMustard'].includes(id));
  if(sauce.length)prep.push(block('Sauces and spreads',sauce,[
    `Stage the selected sauce/spread ingredients: ${bs(sauce)}.`,
    hasAny(['avocado','creamCheese','chipotleAdobo','lime'])?`For the Hawaiian spread, mash ${bs(['avocado','creamCheese','chipotleAdobo','lime'].filter(has))} into a thick spicy guac; loosen only slightly so it stays put.`:'',
    hasAny(['creamCheese','mayo','lime']) && has('creamCheese')?`For cream cheese mayo, soften ${b('creamCheese')} and mix it with ${bs(['mayo','lime','garlicPowder','blackPepper'].filter(has))}; keep it thick enough to stay on the bun.`:'',
    has('figJam')?`Use ${b('figJam')} as a thin layer, preferably with ${has('dijonMustard')?b('dijonMustard'):'a sharp counterpoint'}, not as a loose topping.`:'',
    hasAny(['mayo','garlic','blackPepper','steakSauce']) && hasAny(['babyBellaMushrooms','swissCheese','gruyere','provolone'])?`Keep black-pepper or garlic mayo light; the mushroom/cheese side is already rich.`:'',
    hasAny(['bbqSauce','smokedPaprika'])?`For BBQ-mayo, mix ${bs(['mayo','bbqSauce','smokedPaprika'].filter(has))} lightly; the sauce should support crisp bacon rather than take over.`:''
  ].filter(Boolean)));
  if(fresh.length)prep.push(block('Fresh toppings',fresh,[
    `Prepare the fresh toppings: ${bs(fresh)}.`,
    has('tomato')?`Slice ${b('tomato')}, salt lightly, and blot if watery.`:'',
    has('whiteOnion')?`Slice ${b('whiteOnion')} very thin so it reads sharp rather than harsh.`:'',
    hasAny(['dillPickles','pickledRedOnion','pickledJalapenos'])?`Drain ${bs(['dillPickles','pickledRedOnion','pickledJalapenos'].filter(has))} before stacking.`:'',
    has('shreddedIceberg')?`Dry ${b('shreddedIceberg')} well; it should add cold crunch, not water.`:''
  ].filter(Boolean)));
  if(cooked.length)prep.push(block('Cooked topping prep',cooked,[
    `Stage cooked topping ingredients: ${bs(cooked)}.`,
    has('thickCutBacon')?`Cook ${b('thickCutBacon')} first until very crisp; reserve a small spoon of fat for the onion.`:'',
    has('yellowOnion')?`Slice ${b('yellowOnion')} thin; for the bacon burger, griddle it in a little bacon fat rather than turning it into jam.`:'',
    has('babyBellaMushrooms')?`Slice ${b('babyBellaMushrooms')} and cook them in a wide pan so they brown instead of steaming.`:'',
    has('pineapple')?`Pat ${b('pineapple')} dry before searing or grilling so it caramelizes instead of leaking into the burger.`:'',
    has('freshJalapeno')?`For the jalapeño burger, blister or char ${b('freshJalapeno')} before chopping; this is the roasted green-heat layer, while ${has('pickledJalapenos')?b('pickledJalapenos'):'pickled jalapeños'} provide acid later.`:'',
    has('griddledWhiteOnion')?`Slice ${b('griddledWhiteOnion')} thin and keep it sharper than caramelized onion.`:''
  ].filter(Boolean)));
  prep.push(block('Shape and season patties',patty.length?patty:['groundChuck'],[
    has('groundChuck')?`Shape ${b('groundChuck')} gently; avoid kneading the meat.`:'Choose a burger patty before cooking.',
    st().methods.has('thinSmash')?`For a thin smash patty, use loose 2–3 oz balls and smash hard in the first 20–30 seconds.`:st().methods.has('doubleSmash')?`For double smash, make two smaller loose balls rather than one thick patty.`:st().methods.has('thickPub')?`For a thick pub patty, shape 6–8 oz patties and plan on a gentler finish after searing.`:st().methods.has('pattyMeltMethod')?`For a patty melt, shape the patty thin and wide to match the rye bread.`:st().methods.has('outdoorGrill')?`For outdoor grilling, shape a slightly thicker patty and do not smash it on the grate.`:`For the default skillet patty, shape 4–6 oz patties about 1/2–3/4 inch thick and wider than the bun.`,
    `Salt the outside just before cooking. Use a thin film of ${has('neutralOil')?b('neutralOil'):'neutral oil'} only if the skillet needs help; use ${has('butter')?b('butter'):'butter'} for bread, onions, mushrooms, or patty melts rather than hard-searing the meat.`
  ]));
  if(cooked.length) cook.push(block('Cook the topping layer',cooked,[
    has('thickCutBacon')?`Cook ${b('thickCutBacon')} crisp before the patties.`:'',
    has('yellowOnion')?`Cook ${b('yellowOnion')} in the right register: in bacon fat until browned for the bacon burger, or low and slow for caramelized onion builds.`:'',
    has('babyBellaMushrooms')?`Brown ${b('babyBellaMushrooms')} hard until they give up water and concentrate before adding ${bs(['shallot','garlic','worcestershire','drySherry','sherryVinegar','freshThyme'].filter(has)) || 'aromatics or liquid'}.`:'',
    has('pineapple')?`Sear or grill ${b('pineapple')} until browned on the edges.`:'',
    has('freshJalapeno')?`Char ${b('freshJalapeno')} in the hot pan or on the grill, then chop it so it can sit evenly over the cheese.`:'',
    has('griddledWhiteOnion')?`Griddle ${b('griddledWhiteOnion')} briefly in the burger pan; leave some sharpness so it still reads like a jalapeño burger.`:'',
    has('thickCutBacon')&&has('yellowOnion')?`For the bacon burger, the onion should pick up bacon fat and browning while the bacon stays crisp enough to snap.`:'',
    hasAny(['appleCiderVinegar','brownSugar'])?`If using jam-style ingredients, add ${bs(['appleCiderVinegar','brownSugar','blackPepper'].filter(has))} sparingly so it tastes sharp, not candied.`:''
  ].filter(Boolean)));
  cook.push(block('Cook patties and melt cheese',[...patty,...cheese],[
    st().methods.has('thinSmash')||st().methods.has('doubleSmash')?`Cook smash patties on a very hot surface; once smashed, leave them alone until the crust releases.`:st().methods.has('outdoorGrill')?`Grill over high heat for char, then move to a cooler zone if the center needs more time.`:st().methods.has('thickPub')?`Sear both sides, then lower heat or cover briefly so the center finishes without burning the crust.`:st().methods.has('pattyMeltMethod')?`Sear the bread-shaped patty, then transfer it into the buttered rye sandwich.`:`Cook in a hot skillet, flipping once after a solid crust forms.`,
    st().methods.has('mustardFried')?`For the mustard-fried side, smear ${b('yellowMustard')} on the raw top after the first side starts searing, then flip onto the mustard.`:'',
    cheese.length?`Melt ${bs(cheese)} near the end.${has('dublinerCheese')?' Slice Dubliner thin; it softens more than it melts.':''}`:'',
    st().methods.has('steamMelt')?`Use the steam melt sparingly: a tiny splash of water away from the patty, covered for 10–20 seconds.`:st().methods.has('coveredMelt')?`Cover briefly for stubborn cheeses or thicker patties.`:''
  ].filter(Boolean)));
  cook.push(block('Toast bread and assemble',[...bread,...sauce,...fresh,...cooked],[
    bread.length?`Toast ${bs(bread)}. ${st().methods.has('pattyMeltMethod')?'Butter the outside of the rye and griddle the assembled sandwich.':'Butter or dry-toast the cut faces until they can resist sauce.'}`:'Toast the chosen bun or bread.',
    sauce.length?`Spread ${bs(sauce)} deliberately; keep wet spreads controlled.`:'Add sauce only if the build needs it.',
    has('shreddedIceberg')?`Use ${b('shreddedIceberg')} as a cold crunch/moisture barrier on classic, jalapeño, or bacon builds.`:'',
    hasAny(['freshJalapeno','pickledJalapenos','creamCheese'])?`For the jalapeño burger, keep the layers distinct: cream cheese mayo on the bun, charred ${has('freshJalapeno')?b('freshJalapeno'):'jalapeño'} with the hot patty, ${has('griddledWhiteOnion')?b('griddledWhiteOnion'):'griddled white onion'} for sharpness, and ${has('pickledJalapenos')?b('pickledJalapenos'):'pickled jalapeños'} late for acid.`:'',
    `Add the patty${cheese.length?' with melted cheese':''}, then the cooked topping layer${cooked.length?`: ${bs(cooked)}`:'.'}`,
    fresh.length?`Finish with ${bs(fresh)} according to the build: sharp/wet items high and drained, delicate greens late.`:'Close the burger while hot.',
    hasAny(['pineapple','avocado','creamCheese','chipotleAdobo'])?`For Hawaiian, keep ${bs(['pineapple','avocado','creamCheese','chipotleAdobo'].filter(has))} away from the bottom bun so the burger stays stable.`:'',
    st().methods.has('pattyMeltMethod')?`For a patty melt, the final stack is rye, cheese, patty, caramelized onion, cheese, rye; griddle until the bread is crisp and the cheese binds everything.`:''
  ].filter(Boolean)));
  return `<div class="instruction-stack">${prep.join('')}${cook.join('')}</div>`;
}

function genericInstructions(){
  const d=domain();
  const blocks=[];
  for(const lane of d.lanes||[]){
    for(const mid of lane.modules||[]){
      const ids=selectedInModule(mid);
      if(!ids.length) continue;
      const title=d.modules[mid]?.title||mid;
      blocks.push(block(title,ids,[`Prep and use ${bs(ids)} according to the role of this module.`]));
    }
  }
  return `<div class="instruction-stack">${blocks.join('')}</div>`;
}
const INSTRUCTION_RENDERERS={steak:steakInstructions,chicken:chickenInstructions,stirfry:stirfryInstructions,burger:burgerInstructions};

function amountForGroup(g){
  const packUnits=new Set(['jar','bottle','tub','carton','head','bunch','loaf','bag','pack','knob']);
  const countUnits=new Set(['each','rolls','roll','buns','bun','pitas','pieces','oranges','limes','lemons','lemon']);
  const numeric=g.entries.filter(i=>typeof i.qty==='number' && i.unit);
  if(!numeric.length) return 'as needed';
  const units=unique(numeric.map(i=>i.unit));
  if(units.length>1) return 'as needed / see uses';
  const unit=units[0];
  const vals=numeric.map(i=>i.qty);
  if(packUnits.has(unit)) return `${fmt(Math.max(...vals))} ${unit}`;
  if(countUnits.has(unit)) return `${fmt(Math.max(...vals))} ${unit}`;
  const total=vals.reduce((a,b)=>a+b,0);
  return `${fmt(total)} ${unit}`;
}
function normalizedShopKey(raw){
  let key=String(raw||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
  key=key.replace(/&/g,' and ').replace(/[^a-z0-9]+/g,' ').replace(/\s+/g,' ').trim();
  const aliases={
    'fresno':'fresno pepper', 'raw fresno':'fresno pepper', 'raw fresno pepper':'fresno pepper', 'fresnos':'fresno pepper', 'fresno peppers':'fresno pepper',
    'jalapeno':'jalapeno pepper', 'jalapenos':'jalapeno pepper', 'jalapeno peppers':'jalapeno pepper', 'pickled jalapenos':'pickled jalapeno', 'pickled jalapeno peppers':'pickled jalapeno',
    'lemon':'lemons', 'lemons':'lemons', 'lemon finish':'lemons', 'lemon juice':'lemons', 'lime':'limes', 'limes':'limes', 'lime juice':'limes',
    'garlic cloves':'garlic', 'garlic clove':'garlic', 'roasted garlic':'garlic', 'fresh herbs':'fresh herbs',
    'bread and butter brine':'bread and butter pickles', 'bread and butter pickle brine':'bread and butter pickles',
    'pickle brine':'dill pickles', 'dill pickle brine':'dill pickles'
  };
  return aliases[key]||key;
}
function canonicalShopName(key,fallback){const names={'fresno pepper':'Fresno pepper','jalapeno pepper':'Jalapeño','pickled jalapeno':'Pickled jalapeños','white onion':'White onion','lemons':'Lemons','limes':'Limes','garlic':'Garlic','bread and butter pickles':'Bread & butter pickles','dill pickles':'Dill pickles'}; return names[key]||fallback;}
function shopKeyFor(i){return normalizedShopKey(i.shopKey||i.shopName||i.name);}
function groceryItems(){const d=domain(); const groups={}; for(const keyOcc of st().selectedKeys||[]){const [moduleId,id]=String(keyOcc).split('::'); const i=item(id); if(!i||i.shop===false)continue; const key=shopKeyFor(i); if(!groups[key])groups[key]={key,name:canonicalShopName(key,i.shopName||i.name),aisle:i.aisle||'pantry',order:i.order??50,entries:[],uses:new Set(),sourceNames:new Set()}; const g=groups[key]; g.name=canonicalShopName(key,g.name); g.order=Math.min(g.order,i.order??50); g.entries.push(i); g.sourceNames.add(i.name); if(moduleId)g.uses.add(d.modules[moduleId]?.title||moduleId); if((COMMON_AISLES[i.aisle]?.order??99)<(COMMON_AISLES[g.aisle]?.order??99)) g.aisle=i.aisle||g.aisle;} return Object.values(groups).map(g=>{g.amount=amountForGroup(g); g.uses=[...g.uses].sort((a,b)=>a.localeCompare(b)); g.sources=[...g.sourceNames].sort((a,b)=>a.localeCompare(b)); return g;}).sort((a,b)=>aisleOrder(a.aisle)-aisleOrder(b.aisle)||a.order-b.order||a.name.localeCompare(b.name));}
function aisleConfig(){return domain().aisles||COMMON_AISLES;} function aisleOrder(a){return (aisleConfig()[a]?.order ?? COMMON_AISLES[a]?.order ?? 99);} function aisleLabel(a){return aisleConfig()[a]?.label || COMMON_AISLES[a]?.label || a;}
function renderGrocery(){const items=groceryItems(); E('#groceryStatus').textContent=items.length?`${items.length} shopping items`:'No grocery items'; const by={}; items.forEach(g=>{(by[g.aisle] ||= []).push(g);}); E('#groceryContent').innerHTML=Object.keys(by).sort((a,b)=>aisleOrder(a)-aisleOrder(b)).map(a=>`<section class="grocery-group"><h3>${esc(aisleLabel(a))}</h3>${by[a].map(g=>`<div class="grocery-row compact"><div><div class="grocery-name">${esc(g.name)}</div>${g.sources.length>1?`<div class="grocery-meta">covers ${esc(g.sources.join(', '))}</div>`:''}</div><div class="grocery-amount">${esc(g.amount)}</div></div>`).join('')}</section>`).join('')||'<div class="empty">No grocery items yet.</div>';}
function groceryText(){
  const items=groceryItems(), by={};
  items.forEach(g=>{(by[g.aisle] ||= []).push(g);});
  return Object.keys(by)
    .sort((a,b)=>aisleOrder(a)-aisleOrder(b))
    .map(a=>`${aisleLabel(a)}\n` + by[a].map(g=>`- ${g.name}${g.amount?' — '+g.amount:''}`).join('\n'))
    .join('\n\n');
}
async function copyGrocery(){const text=groceryText(); if(!text){showToast('Nothing to copy');return;} try{await navigator.clipboard.writeText(text); showToast('Grocery list copied');}catch(e){const ta=document.createElement('textarea'); ta.value=text; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); ta.remove(); showToast('Grocery list copied');}}
function prepText(){const clone=E('#prepContent').cloneNode(true); clone.querySelectorAll('button,.meta-label').forEach(n=>n.remove()); return clone.innerText.replace(/\n{3,}/g,'\n\n').trim();}
async function copyPrep(){const text=prepText(); if(!text){showToast('Nothing to copy');return;} try{await navigator.clipboard.writeText(text); showToast('Prep/cook plan copied');}catch(e){const ta=document.createElement('textarea'); ta.value=text; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); ta.remove(); showToast('Prep/cook plan copied');}}

function applyPreviewClasses(){
  EA('[data-ingredient]').forEach(btn=>btn.classList.toggle('preview-member', previewIngredientKeys.has(btn.dataset.ingredientKey)));
  EA('[data-method]').forEach(btn=>btn.classList.toggle('preview-member', previewIds.has(btn.dataset.method)));
  EA('.component-wrap').forEach(w=>{const own=w.querySelector('[data-component]')?.dataset.component; w.classList.toggle('preview-component', Boolean(previewComponent && own===previewComponent));});
}
function setPreviewFromElement(el){previewIds=new Set(String(el.dataset.preview||'').split(',').filter(Boolean)); previewIngredientKeys=new Set(String(el.dataset.previewKeys||'').split(',').filter(Boolean)); previewComponent=el.dataset.previewComponent||null; applyPreviewClasses();}
function clearPreview(){if(previewIds.size||previewIngredientKeys.size||previewComponent){previewIds=new Set(); previewIngredientKeys=new Set(); previewComponent=null; applyPreviewClasses();}}

function activateTab(tabName){activeTab=['build','grocery','prep'].includes(tabName)?tabName:'build'; EA('.tab-btn').forEach(b=>b.classList.toggle('active',b.dataset.tab===activeTab)); EA('.tab-panel').forEach(p=>p.classList.toggle('active',p.id===`panel-${activeTab}`)); const btn=E('#tabActionBtn'); if(btn){btn.textContent=activeTab==='build'?'Reset build':(activeTab==='grocery'?'Copy shopping list':'Copy instructions'); btn.dataset.action=activeTab==='build'?'reset':(activeTab==='grocery'?'copyGrocery':'copyPrep');}}
document.addEventListener('click',e=>{const settingsOpen=e.target.closest('[data-settings-open]'); if(settingsOpen){openSettings(); return;} const settingsClose=e.target.closest('[data-settings-close]'); if(settingsClose){closeSettings(); return;} if(e.target.id==='settingsOverlay'){closeSettings(); return;} const home=e.target.closest('#homeBtn'); if(home){currentDomain=null; activeTab='build'; renderAll(); return;} const domainBtn=e.target.closest('[data-domain]'); if(domainBtn){currentDomain=domainBtn.dataset.domain; activeTab='build'; save(); renderAll(); return;} if(!currentDomain)return; const presetBtn=e.target.closest('[data-preset]'); if(presetBtn){applyPreset(presetBtn.dataset.preset); return;} const ingBtn=e.target.closest('[data-ingredient]'); if(ingBtn){toggleIngredient(ingBtn.dataset.ingredient, ingBtn.dataset.module); return;} const compBtn=e.target.closest('[data-component]'); if(compBtn){toggleComponent(compBtn.dataset.component); return;} const meth=e.target.closest('[data-method]'); if(meth){toggleMethod(meth.dataset.method); return;} const clr=e.target.closest('[data-clear-module]'); if(clr){clearModule(clr.dataset.clearModule); return;} const action=e.target.closest('#tabActionBtn'); if(action){if(action.dataset.action==='reset'){setSelected([],[]); st().selectedKeys=new Set(); st().basePreset=null; st().components={}; save(); renderAll(); return;} if(action.dataset.action==='copyGrocery'){copyGrocery(); return;} if(action.dataset.action==='copyPrep'){copyPrep(); return;}} const tab=e.target.closest('[data-tab]'); if(tab){activateTab(tab.dataset.tab);}});
document.addEventListener('change',e=>{const pal=e.target.closest('input[name="paletteMode"]'); if(pal){localStorage.setItem(PALETTE_KEY,pal.value); applyPalette(pal.value);}});
document.addEventListener('keydown',e=>{if(e.key==='Escape') closeSettings();});
document.addEventListener('mouseover',e=>{const p=e.target.closest('[data-preview],[data-preview-keys]'); if(p)setPreviewFromElement(p);});
document.addEventListener('mouseout',e=>{const p=e.target.closest('[data-preview],[data-preview-keys]'); if(p)clearPreview();});
E('#presetSelect')?.addEventListener('change',e=>{if(e.target.value)applyPreset(e.target.value);});

load(); applyPalette(); renderAll();
