<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />

<title>Cooking Builder 0.7</title>
<style>

[data-theme="chicken"]{--accent:#b84c1e;--accent2:#d4a017;--good:#5a7a5e;--lane1:#f0dfc6;--lane2:#ead8bd;--lane3:#efe6d7;--lane4:#e4eadf;}

*{box-sizing:border-box}

.subhead{margin:.55rem auto 0;max-width:920px;color:var(--muted);font-size:.88rem;line-height:1.45}.version{position:absolute;top:.75rem;right:.85rem;border:1px solid var(--line);border-radius:999px;padding:.2rem .44rem;color:var(--muted);font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:.56rem;letter-spacing:.12em;text-transform:uppercase}
.topbar{display:flex;gap:.65rem;align-items:center;flex-wrap:wrap;background:var(--ink);color:var(--paper);padding:.78rem 1.1rem}.bar-label,.eyebrow,.mini-label,.section-label,.meta-label{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;text-transform:uppercase;letter-spacing:.15em;font-size:.56rem}.bar-label{color:rgba(255,250,241,.58)}
.domain-btn,.preset-btn,.tab-btn,.ghost-btn,.component-chip,.method-chip,.builder-card{position:relative;border-radius:999px;border:1px solid rgba(255,250,241,.3);background:transparent;color:var(--paper);padding:.4rem .72rem;font-size:.74rem;transition:.15s ease}.domain-btn:hover,.preset-btn:hover,.domain-btn:focus-visible,.preset-btn:focus-visible{background:var(--accent2);border-color:var(--accent2);color:var(--ink);outline:none}.domain-btn.active,.preset-btn.active{background:var(--accent);border-color:var(--accent);color:white}.domain-group,.preset-group{display:flex;gap:.42rem;align-items:center;flex-wrap:wrap}.preset-caption{flex:1 1 260px;color:rgba(255,250,241,.66);font-size:.7rem;line-height:1.35}.select-wrap{margin-left:auto;display:flex;align-items:center;gap:.45rem}.preset-select{border:1px solid rgba(255,250,241,.3);border-radius:999px;background:rgba(255,255,255,.04);color:var(--paper);padding:.38rem .75rem;font-size:.73rem}.preset-select option{color:var(--ink)}.preset-select.active{background:var(--accent2);color:var(--ink);border-color:var(--accent2)}
.tabbar{display:flex;gap:.5rem;align-items:center;flex-wrap:wrap;padding:.9rem 1.1rem 0}.tab-btn,.ghost-btn{border-color:var(--line2);color:var(--ink);background:transparent}.tab-btn.active{background:var(--ink);color:var(--paper);border-color:var(--ink)}.ghost-btn{margin-left:auto}.ghost-btn:hover{background:var(--paper)}.tab-panel{display:none;padding:1rem 1.1rem 2rem}.tab-panel.active{display:block}.intro-row{display:flex;justify-content:space-between;gap:1rem;align-items:flex-start;margin-bottom:.85rem;color:var(--muted);font-size:.78rem;line-height:1.45}.intro-row strong{color:var(--ink)}
.layout{display:grid;grid-template-columns:minmax(0,1fr);gap:.95rem;align-items:start}.builder-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:.78rem}.lane{border:1px solid var(--line2);border-radius:.78rem;padding:.62rem;min-width:0;box-shadow:var(--shadow)}.lane:nth-child(4n+1){background:var(--lane1)}.lane:nth-child(4n+2){background:var(--lane2)}.lane:nth-child(4n+3){background:var(--lane3)}.lane:nth-child(4n+4){background:var(--lane4)}.lane-head{padding:.28rem .28rem .62rem;border-bottom:1px solid var(--line);margin-bottom:.6rem}.lane-title{margin:.08rem 0 0;font-family:Georgia,"Times New Roman",serif;font-size:1.16rem;line-height:1.05}.lane-note{margin:.25rem 0 0;color:var(--muted);font-size:.67rem;line-height:1.35}.module{background:rgba(255,250,242,.85);border:1px solid var(--line);border-radius:.62rem;padding:.62rem;margin-bottom:.6rem;box-shadow:0 4px 14px rgba(43,25,13,.035)}.module:last-child{margin-bottom:0}.module-head{display:flex;justify-content:space-between;gap:.55rem;align-items:flex-start;margin-bottom:.48rem}.module-title{font-family:Georgia,"Times New Roman",serif;font-size:1.02rem;font-weight:800;line-height:1.08}.module-note{margin:.18rem 0 0;color:var(--muted);font-size:.66rem;line-height:1.35}.clear-module{border:0;background:transparent;color:var(--muted);font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:.49rem;letter-spacing:.1em;text-transform:uppercase;padding:.1rem}.clear-module:hover{color:var(--accent)}.section{margin-top:.5rem}.section-label{color:var(--muted);margin-bottom:.28rem}
.component-grid,.method-grid{display:flex;gap:.28rem;flex-wrap:wrap}.ingredient-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(112px,1fr));gap:.28rem}.component-wrap{display:inline-flex;position:relative;border:1px dashed transparent;border-radius:999px;padding:.08rem;transition:.13s ease}.component-wrap.active{border-color:rgba(140,52,40,.38);background:rgba(140,52,40,.045)}.component-wrap.preview-component,.component-wrap:hover{border-color:var(--preview);background:rgba(168,102,40,.07)}.component-chip,.method-chip{border-color:var(--line2);color:var(--ink);background:transparent;padding:.25rem .48rem;font-size:.62rem;font-weight:700}.component-chip:hover,.component-chip:focus-visible,.method-chip:hover,.method-chip:focus-visible{outline:none;background:var(--accent2);border-color:var(--accent2);color:var(--ink)}.component-chip.active,.method-chip.active{background:var(--accent);border-color:var(--accent);color:white}.ingredient-chip{position:relative;display:flex;justify-content:space-between;align-items:center;gap:.35rem;min-height:31px;border:1px solid transparent;border-radius:.32rem;background:var(--soft);color:var(--ink);padding:.25rem .35rem;text-align:left;transition:.13s ease}.ingredient-chip:hover,.ingredient-chip:focus-visible{outline:none;border-color:var(--line2);background:var(--soft2)}.ingredient-chip.preview-member,.method-chip.preview-member{outline:2px dotted var(--preview);outline-offset:2px;border-color:var(--preview);box-shadow:0 0 0 3px rgba(168,102,40,.09)}.ingredient-chip.selected{background:var(--selected);border-color:var(--selected);color:var(--selectedFg)}.ingredient-chip.alternative:not(.selected),.component-chip.alternative:not(.active),.method-chip.alternative:not(.active){border-color:var(--accent2);box-shadow:inset 0 0 0 1px rgba(199,155,59,.38)}.ingredient-chip.optional:not(.selected),.component-chip.optional:not(.active),.method-chip.optional:not(.active){border-color:var(--good);border-style:dashed}.ing-side{display:flex;align-items:center;gap:.25rem;white-space:nowrap}.ing-status{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:.45rem;text-transform:uppercase;letter-spacing:.08em;border-radius:999px;padding:.05rem .22rem;border:1px solid currentColor;opacity:.78}.ingredient-chip.selected .ing-status{color:rgba(255,250,241,.82)}.grocery-group{padding:.68rem .78rem}.grocery-group h3{display:flex;align-items:center;gap:.5rem}.grocery-group h3::after{content:'';height:1px;background:var(--line);flex:1}.grocery-row.compact .grocery-name{font-size:.8rem}.grocery-row.compact .grocery-amount{font-size:.62rem}.tip-line.muted{color:rgba(255,250,241,.66)}.ing-name{font-weight:720;font-size:.68rem;line-height:1.08}.ing-meta{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:.48rem;opacity:.72;white-space:nowrap}.tip{display:none;position:absolute;z-index:1200;left:50%;bottom:calc(100% + 8px);transform:translateX(-50%);width:min(340px,86vw);background:var(--ink);color:var(--paper);border-radius:.48rem;padding:.68rem .72rem;box-shadow:0 12px 30px rgba(0,0,0,.28);pointer-events:none;text-align:left}.tip::after{content:"";position:absolute;top:100%;left:50%;transform:translateX(-50%);border:6px solid transparent;border-top-color:var(--ink)}.component-wrap:hover .tip,.ingredient-chip:hover .tip,.method-chip:hover .tip,.preset-btn:hover .tip{display:block}.tip-title{font-weight:800;font-size:.78rem;color:white;margin-bottom:.22rem}.tip-line{font-size:.7rem;line-height:1.34;color:rgba(255,250,241,.82);margin-top:.18rem}.tip-line strong{color:var(--accent2)}
.sidebar{position:sticky;top:.75rem;display:grid;gap:.74rem}.side-card,.instruction-block,.grocery-group,.note-card{background:var(--paper);border:1px solid var(--line);border-radius:.7rem;padding:.78rem;box-shadow:var(--shadow)}.side-head{display:flex;justify-content:space-between;gap:.75rem;align-items:flex-start}.side-title{font-family:Georgia,"Times New Roman",serif;font-size:1.38rem;font-weight:900}.identity{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:.62rem;letter-spacing:.1em;text-transform:uppercase;color:var(--accent);margin-top:.2rem}.summary-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:.42rem;margin-top:.65rem}.summary-item{background:var(--card);border:1px solid var(--line);border-radius:.5rem;padding:.5rem;font-size:.62rem;color:var(--muted)}.summary-item strong{display:block;color:var(--ink);font-size:.76rem;margin-top:.1rem}.pill-list,.selected-list,.grocery-preview{display:flex;gap:.25rem;flex-wrap:wrap;margin-top:.5rem}.pill,.selected-pill{font-size:.64rem;border:1px solid var(--line);background:var(--soft);border-radius:999px;padding:.18rem .42rem}.selected-pill.core{background:var(--ink);color:var(--paper)}.warning-list{display:grid;gap:.42rem;margin-top:.5rem}.warning{font-size:.72rem;line-height:1.35;border-left:3px solid var(--accent);padding:.3rem .45rem;background:rgba(184,76,30,.055);border-radius:.25rem}.stack-list{display:grid;gap:.28rem;margin-top:.5rem}.stack-row{display:flex;justify-content:space-between;gap:.6rem;border-bottom:1px solid var(--line);padding-bottom:.25rem;font-size:.72rem}.stack-row:last-child{border-bottom:0}.stack-row span{color:var(--muted)}
.instruction-grid,.instruction-stack{display:grid;grid-template-columns:1fr;gap:.7rem;align-items:start}.instruction-column{display:grid;gap:.7rem}.instruction-block h3,.grocery-group h3,.note-card h3{margin:0 0 .35rem;font-family:Georgia,"Times New Roman",serif;font-size:1.05rem}.block-ingredients{display:flex;gap:.24rem;flex-wrap:wrap;margin:.35rem 0 .5rem}.block-ingredients span{font-size:.6rem;background:var(--soft);border:1px solid var(--line);border-radius:999px;padding:.16rem .38rem}.instruction-block ol{margin:.35rem 0 0;padding-left:1.2rem}.instruction-block li{font-size:.82rem;line-height:1.46;margin:.28rem 0}.instruction-block strong{color:var(--accent)}.empty{border:1px dashed var(--line2);border-radius:.7rem;padding:1rem;color:var(--muted);background:rgba(255,250,242,.6)}
.grocery-tools{display:flex;gap:.5rem;align-items:center;flex-wrap:wrap;margin-bottom:.8rem}.copy-btn{border:1px solid var(--line2);background:var(--ink);color:var(--paper);border-radius:999px;padding:.46rem .78rem;font-size:.74rem}.copy-btn:hover{background:var(--accent)}.grocery-layout{display:grid;grid-template-columns:1fr;gap:.6rem;max-width:860px}.grocery-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:.75rem;border-bottom:1px solid var(--line);padding:.34rem 0;align-items:baseline}.grocery-row:last-child{border-bottom:0}.grocery-name{font-weight:740;font-size:.82rem}.grocery-meta{font-size:.64rem;color:var(--muted);line-height:1.3;margin-top:.04rem}.grocery-amount{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:.63rem;color:var(--muted);white-space:nowrap}.notes-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:.75rem}.note-card p,.note-card li{font-size:.82rem;color:var(--muted);line-height:1.45}.note-card ul{margin:.4rem 0 0;padding-left:1.1rem}.toast{position:fixed;left:50%;bottom:1rem;transform:translateX(-50%);background:var(--ink);color:var(--paper);border-radius:999px;padding:.58rem .9rem;font-size:.74rem;box-shadow:0 12px 30px rgba(0,0,0,.24);opacity:0;pointer-events:none;transition:.18s ease;z-index:2000}.toast.show{opacity:1}

@media(max-width:720px){header{text-align:left}.version{position:static;display:inline-block;margin-top:.5rem}.topbar,.tabbar,.tab-panel{padding-left:.75rem;padding-right:.75rem}.builder-grid,.instruction-grid,.grocery-layout{grid-template-columns:1fr}.select-wrap{margin-left:0}.summary-grid{grid-template-columns:1fr}}

.component-wrap.partial{border-color:rgba(168,102,40,.42);background:rgba(168,102,40,.04)}
.component-chip.partial{border-color:var(--preview);background:rgba(168,102,40,.08)}
.strong-pill{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.partial-pill{background:rgba(168,102,40,.12);border-color:rgba(168,102,40,.36)}
.muted-pill{opacity:.62;text-decoration:line-through}.diff-row{margin-top:.55rem}.diff-row>strong{display:block;font-size:.68rem;margin-bottom:.25rem;color:var(--muted)}
.module-map{display:grid;gap:.46rem;margin-top:.52rem}.module-bucket{background:var(--card);border:1px solid var(--line);border-radius:.5rem;padding:.48rem}.module-bucket>strong{display:block;font-size:.72rem;margin-bottom:.28rem;color:var(--accent)}.module-bucket div{display:flex;gap:.22rem;flex-wrap:wrap}.module-pill{font-size:.61rem;border:1px solid var(--line);background:var(--soft);border-radius:999px;padding:.14rem .34rem}.empty-small{font-size:.7rem;color:var(--muted);padding:.3rem 0}
.block-ingredients strong{font-weight:800}

.meter-list{display:grid;gap:.55rem;margin-top:.55rem}.meter-row{display:grid;grid-template-columns:94px 1fr 46px;gap:.5rem;align-items:center}.meter-name{font-size:.68rem;font-weight:800}.meter-track{height:12px;background:var(--soft);border:1px solid var(--line);border-radius:999px;overflow:hidden}.meter-fill{height:100%;border-radius:999px;background:var(--muted);transition:width .16s ease}.meter-row.low .meter-fill{background:#8b99a5}.meter-row.good .meter-fill{background:var(--good)}.meter-row.high .meter-fill{background:var(--accent2)}.meter-row.over .meter-fill{background:var(--accent)}.meter-status{font-size:.62rem;text-align:right;color:var(--muted)}.hint-small{font-size:.68rem;color:var(--muted);line-height:1.35;margin-top:.55rem}.prep-tools{display:flex;align-items:center;gap:.55rem;flex-wrap:wrap;margin-bottom:.8rem}.prep-tools .copy-btn{padding:.4rem .72rem}


.landing{max-width:1160px;margin:0 auto;padding:1.1rem}.builder-cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:.85rem}.builder-card{position:relative;display:flex;flex-direction:column;align-items:flex-start;justify-content:flex-end;gap:.35rem;min-height:138px;text-align:left;border-radius:1rem;border:1px solid var(--line2);background:var(--paper);color:var(--ink);padding:1rem;box-shadow:var(--shadow)}.builder-card:hover,.builder-card:focus-visible{outline:none;transform:translateY(-1px);border-color:var(--accent);box-shadow:0 16px 38px rgba(44,26,13,.12)}.builder-card strong{font-family:Georgia,"Times New Roman",serif;font-size:1.55rem;line-height:1;color:var(--accent)}.builder-card span:last-child{color:var(--muted);font-size:.8rem;line-height:1.4}.builder-kicker{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;text-transform:uppercase;letter-spacing:.15em;font-size:.56rem;color:var(--muted)}.app-shell[hidden],.landing[hidden]{display:none!important}.topbar{align-items:flex-start}.topbar .all-builders{margin-right:.2rem;border-color:rgba(255,250,241,.4);color:var(--paper)}.topbar .all-builders:hover{background:var(--accent2);color:var(--ink)}.preset-zone{display:flex;gap:.55rem;align-items:center;flex-wrap:wrap;flex:1}.preset-caption{flex-basis:100%;margin-top:.2rem}.tabbar .copy-btn{margin-left:auto}.component-chip.active,.method-chip.active{box-shadow:inset 0 0 0 1px rgba(255,255,255,.38)}
@media(max-width:900px){.builder-cards{grid-template-columns:1fr}.builder-card{min-height:132px}}


/* 0.6 streamlined navigation/preset placement */
.topbar{align-items:center;justify-content:flex-start;padding:.62rem .9rem;gap:.7rem}
.home-btn{width:2.05rem;height:2.05rem;border-radius:999px;border:1px solid rgba(255,250,241,.42);background:transparent;color:var(--paper);font-size:1.05rem;line-height:1;display:inline-flex;align-items:center;justify-content:center}
.home-btn:hover,.home-btn:focus-visible{outline:none;background:var(--accent2);border-color:var(--accent2);color:var(--ink)}
.top-title{font-family:Georgia,"Times New Roman",serif;font-weight:900;font-size:1.05rem;color:var(--paper)}
.tabbar{position:sticky;top:0;z-index:800;background:rgba(245,240,232,.93);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding:.78rem 1.1rem}.tab-btn{font-size:.82rem;padding:.5rem .9rem}.tab-action{margin-left:auto;font-weight:800}.global-presets-card{background:var(--paper);border:1px solid var(--line2);border-radius:.78rem;padding:.68rem .78rem;margin:0 0 .85rem;box-shadow:var(--shadow)}
.global-presets-card .preset-zone{display:grid;gap:.5rem;align-items:start}.preset-zone-head{display:flex;align-items:baseline;gap:.75rem;flex-wrap:wrap}.global-presets-card .bar-label{color:var(--accent)}.global-presets-card .preset-caption{flex:1 1 auto;margin:0;color:var(--muted);font-size:.72rem;line-height:1.35}.global-presets-card .preset-btn{border-color:var(--line2);color:var(--ink);background:transparent}.global-presets-card .preset-btn:hover,.global-presets-card .preset-btn:focus-visible{background:var(--accent2);border-color:var(--accent2);color:var(--ink);outline:none}.global-presets-card .preset-btn.active{background:var(--accent);border-color:var(--accent);color:white}.global-presets-card .select-wrap{margin-left:0}.global-presets-card .preset-select{border-color:var(--line2);background:var(--card);color:var(--ink)}.global-presets-card .preset-select.active{background:var(--accent2);border-color:var(--accent2);color:var(--ink)}
.grocery-tools,.prep-tools{margin-bottom:.55rem}.copy-btn{border:1px solid var(--line2);background:transparent;color:var(--ink);border-radius:999px;padding:.46rem .78rem;font-size:.74rem}.copy-btn:hover{background:var(--paper);color:var(--ink)}

/* 0.7 cleanup: remove visible filler copy, keep data in tooltips/instructions. */
.subhead,.landing-copy,.intro-row,.lane .eyebrow,.lane-note,.module-note,.prep-tools{display:none!important}
.lane-head{padding:.22rem .28rem .5rem}
.module-head{margin-bottom:.34rem}
.builder-card .builder-kicker{display:none}
.builder-card{min-height:132px}
.builder-card strong{font-size:1.7rem}
.global-presets-card{margin-bottom:.75rem}
.preset-zone-head{gap:.5rem}.preset-caption:empty{display:none}
</style>
</head>
<body data-theme="steak">
<header>
  <h1>Cooking Builder</h1>
  <span class="version">0.7</span>
</header>
<section id="landing" class="landing">
  <div class="builder-cards" id="landingCards"></div>
</section>
<div id="appShell" class="app-shell" hidden>
  <nav class="topbar" aria-label="Builder navigation">
    <button class="home-btn" id="homeBtn" aria-label="Home" title="Home">⌂</button>
    <div class="top-title"><span id="topBuilderName"></span></div>
  </nav>
  <div class="tabbar" role="tablist">
    <button class="tab-btn active" data-tab="build">Ingredients</button>
    <button class="tab-btn" data-tab="grocery">Shopping List</button>
    <button class="tab-btn" data-tab="prep">Instructions</button>
    <button class="ghost-btn tab-action" id="tabActionBtn">Reset build</button>
  </div>
  <main>
    <section class="tab-panel active" id="panel-build">
      <section class="global-presets-card" aria-label="Global presets">
        <div class="preset-zone">
          <div class="preset-zone-head"><span class="bar-label">Global presets</span><span class="preset-caption" id="presetCaption"></span></div>
          <div class="preset-group" id="presetButtons"></div>
          <div class="select-wrap"><label class="bar-label" for="presetSelect">More</label><select id="presetSelect" class="preset-select"></select></div>
        </div>
      </section>
      <div class="layout"><div class="builder-grid" id="builderGrid"></div></div>
    </section>
    <section class="tab-panel" id="panel-grocery"><div class="grocery-tools"><span class="meta-label" id="groceryStatus"></span></div><div class="grocery-layout" id="groceryContent"></div></section>
    <section class="tab-panel" id="panel-prep"><div id="prepContent"></div></section>

 if(bread.length)prep.push(block('Bread prep',bread,[`Prepare ${bs(bread)}.`, st().methods.has('press')?'Split and lightly toast or oil the cut faces before pressing.':'Warm or toast the cut faces enough to resist wet filling.']));
 if(finish.length)prep.push(block('Finish prep',finish,[`Stage the finishing ingredients: ${bs(finish)}.`, 'Drain wet pickles/onions and dry greens; most finish items go on late after the hot filling is controlled.']));
 cook.push(block('Cook the steak and pan mix',[...steak,...pan,...cheese],[whole?'Sear the whole steak hard, rest it, then slice very thin across the grain.':'Brown the shaved/thin steak hot and fast, preferably in batches if the pan looks crowded.', pan.length?`Cook or fold in the pan ingredients: ${bs(pan)}.`:'Keep the pan simple and focus on browning the steak.', hasAny(['drySherry','beefJus','worcestershire'])?'Deglaze only after browning is done, then reduce so the filling is glossy rather than wet.':'', cheese.length?`Melt ${bs(cheese)} with residual heat or a covered pan.`:''].filter(Boolean)));
 cook.push(block('Assemble',[...bread,...spread,...finish],[spread.length?`Spread ${bs(spread)} on the bread before the hot filling.`:'Load the hot filling directly onto the prepared bread.', `Add the steak/pan mixture${cheese.length?' with melted cheese':''}.`, finish.length?`Finish with ${bs(finish)} right before closing.`:'Close while hot.', st().methods.has('press')?'Press briefly; stop before the bread drives all filling out.':'Serve immediately.']));
 return `<div class="instruction-stack">${prep.join('')}${cook.join('')}</div>`;}
function chickenInstructions(){const prep=[],cook=[]; const chicken=selectedInModule('chicken'), wet=selectedInModule('wet'), crust=selectedInModule('crust'), seasoning=selectedInModule('seasoning'), finish=selectedInModule('finish'), bread=selectedInModule('bread'), sauce=selectedInModule('sauce'), greens=selectedInModule('greens'), pickles=selectedInModule('pickles'), extras=selectedInModule('extras'), cheese=selectedInModule('cheese');
 if(chicken.length)prep.push(block('Chicken prep',chicken,[`Start with ${bs(chicken)}.`, has('chickenBreast')?'Slice or pound breast into even cutlets so the crust cooks before the meat dries out.':'Trim thighs and even out thick spots; thighs tolerate aggressive frying better.']));
 if(wet.length)prep.push(block('Wet / brine',wet,[`Whisk the wet ingredients: ${bs(wet)}.`, 'Coat the chicken and refrigerate. For buttermilk/pickle brine, 2–8 hours is useful; for miso/acid-heavy marinades, shorter is safer.', 'Let excess wet drip off before dredging so the crust clings instead of sliding.']));
 if(crust.length || seasoning.length)prep.push(block('Crust / dredge',[...crust,...seasoning],[crust.length?`Set up the crust with ${bs(crust)}.`:'No separate crust selected.', seasoning.length?`Season the dredge with ${bs(seasoning)}.`:'Season the chicken directly if skipping dredge.', hasAny(['panko','pretzels'])?'Keep the crumb layer dry and press it onto the chicken right before cooking.':'Use cornstarch/baking powder for a lighter crisp shell.']));
 if(sauce.length)prep.push(block('Sauce',sauce,[`Mix the sauce ingredients: ${bs(sauce)}.`, has('breadButterBrine')?'Use bread-and-butter brine for sweet tang; it is part of the Other Classic identity.':'Taste for acid and salt before assembling.']));
 if(greens.length || pickles.length || extras.length)prep.push(block('Cold toppings',[...greens,...pickles,...extras],[`Prepare toppings: ${bs([...greens,...pickles,...extras])}.`, 'Drain pickles and wet vegetables. Dry lettuce/slaw so the crust stays crisp.', hasAny(['greenCabbage','napaCabbage'])?'Slice cabbage thin and season it early enough to soften slightly.':''] .filter(Boolean)));
 cook.push(block('Cook the chicken',[...chicken,...crust],[(st().methods.has('airFry')?'Air-fry on a rack with a light oil coating, flipping when the crust has set.':st().methods.has('bake')?'Bake on a rack and use convection if available; expect less aggressive blistering than frying.':st().methods.has('panFry')?'Pan-fry cutlets in a shallow layer of oil until the crust is deeply golden.':'Fry until the crust is deeply golden and the chicken is cooked through.'), finish.length?`Prepare the finish/glaze with ${bs(finish)} while the chicken drains.`:'Let the chicken drain on a rack, not paper towels.', finish.length?'Apply oil/glaze after the crust has set so it seasons without dissolving the coating.':''] .filter(Boolean)));
 cook.push(block('Assemble',[...bread,...sauce,...cheese,...greens,...pickles,...extras],[bread.length?`Toast or warm ${bs(bread)}.`:'Choose bread before assembly.', sauce.length?`Sauce the bread with ${bs(sauce)}.`:'Use a thin mayo/butter layer if the bread needs protection.', cheese.length?`Add ${bs(cheese)} only if it has a clear job; many crisp builds do not need cheese.`:'Skip cheese unless the build needs creaminess.', `Add the chicken, then finish with ${bs([...greens,...pickles,...extras]) || 'the selected toppings'}.`, 'Close and eat while the crust is still crisp.']));
 return `<div class="instruction-stack">${prep.join('')}${cook.join('')}</div>`;}
function stirfryInstructions(){const prep=[],cook=[]; const protein=selectedInModule('protein'), treatment=selectedInModule('treatment'), sauce=selectedInModule('sauce'), veg=selectedInModule('veg'), arom=selectedInModule('aromatics'), finish=selectedInModule('finish'), base=selectedInModule('base');
 if(protein.length)prep.push(block('Protein prep',protein,[`Prep ${bs(protein)} into small, even pieces.`, has('tofu')?'Press tofu and cube it before coating.':'Slice meat thinly across the grain where relevant.']));
 if(treatment.length)prep.push(block('Velvet / marinade',treatment,[`Mix the treatment ingredients: ${bs(treatment)}.`, 'Coat protein lightly; too much baking soda or starch will make the texture weird.']));
 if(sauce.length)prep.push(block('Sauce bowl',sauce,[`Mix the sauce ingredients: ${bs(sauce)}.`, has('cornstarchSlurry')?'Keep slurry smooth and add near the end so it thickens without clumping.':'Hold sauce until vegetables and protein are nearly done.']));
 if(veg.length||arom.length)prep.push(block('Vegetables and aromatics',[...veg,...arom],[`Cut vegetables and aromatics: ${bs([...veg,...arom])}.`, 'Group hard vegetables, quick vegetables, and aromatics separately so timing stays clean.']));
 cook.push(block('Cook sequence',[...protein,...veg,...sauce],[st().methods.has('batchCook')?'Cook protein in batches and remove it before vegetables.':'Cook protein first, then move quickly into vegetables.', veg.length?`Stir-fry vegetables in timing order: hardest first, greens late.`:'Add vegetables if using them.', arom.length?`Add aromatics like ${bs(arom)} briefly before sauce so they bloom without burning.`:'', sauce.length?'Return protein, add sauce, and toss until glossy.':'Season in the pan and keep it dry-hot.'] .filter(Boolean)));
 cook.push(block('Finish and serve',[...finish,...base],[base.length?`Serve over ${bs(base)}.`:'Serve immediately; choose rice or noodles if needed.', finish.length?`Finish with ${bs(finish)} off heat or just before plating.`:'Add a final acid/crunch if the bowl tastes flat.']));
 return `<div class="instruction-stack">${prep.join('')}${cook.join('')}</div>`;}

function amountForGroup(g){
  const packUnits=new Set(['jar','bottle','tub','carton','head','bunch','loaf','bag','pack','knob']);
  const countUnits=new Set(['each','rolls','roll','buns','bun','pitas','pieces','oranges','limes','lemons','lemon']);
  const numeric=g.entries.filter(i=>typeof i.qty==='number' && i.unit);
  if(!numeric.length) return 'as needed';
  const units=unique(numeric.map(i=>i.unit));
  if(units.length>1) return 'as needed / see uses';
  const unit=units[0];
  const vals=numeric.map(i=>i.qty);
  if(packUnits.has(unit)) return `${fmt(Math.max(...vals))} ${unit}`;
  if(countUnits.has(unit)) return `${fmt(Math.max(...vals))} ${unit}`;
  const total=vals.reduce((a,b)=>a+b,0);
  return `${fmt(total)} ${unit}`;
}
function groceryItems(){const d=domain(); const groups={}; for(const id of st().selected){const i=item(id); if(!i||i.shop===false)continue; const key=String(i.shopKey||i.shopName||i.name).toLowerCase().replace(/\s+/g,' ').trim(); if(!groups[key])groups[key]={key,name:i.shopName||i.name,aisle:i.aisle||'pantry',order:i.order??50,entries:[],uses:new Set(),sourceNames:new Set()}; const g=groups[key]; g.order=Math.min(g.order,i.order??50); g.entries.push(i); g.sourceNames.add(i.name); i.modules.forEach(m=>g.uses.add(d.modules[m]?.title||m)); if((COMMON_AISLES[i.aisle]?.order??99)<(COMMON_AISLES[g.aisle]?.order??99)) g.aisle=i.aisle||g.aisle;} return Object.values(groups).map(g=>{g.amount=amountForGroup(g); g.uses=[...g.uses].sort((a,b)=>a.localeCompare(b)); g.sources=[...g.sourceNames].sort((a,b)=>a.localeCompare(b)); return g;}).sort((a,b)=>aisleOrder(a.aisle)-aisleOrder(b.aisle)||a.order-b.order||a.name.localeCompare(b.name));}
function aisleConfig(){return domain().aisles||COMMON_AISLES;} function aisleOrder(a){return (aisleConfig()[a]?.order ?? COMMON_AISLES[a]?.order ?? 99);} function aisleLabel(a){return aisleConfig()[a]?.label || COMMON_AISLES[a]?.label || a;}
function renderGrocery(){const items=groceryItems(); E('#groceryStatus').textContent=items.length?`${items.length} shopping items`:'No grocery items'; const by={}; items.forEach(g=>{(by[g.aisle] ||= []).push(g);}); E('#groceryContent').innerHTML=Object.keys(by).sort((a,b)=>aisleOrder(a)-aisleOrder(b)).map(a=>`<section class="grocery-group"><h3>${esc(aisleLabel(a))}</h3>${by[a].map(g=>`<div class="grocery-row compact"><div><div class="grocery-name">${esc(g.name)}</div>${g.sources.length>1?`<div class="grocery-meta">covers ${esc(g.sources.join(', '))}</div>`:''}</div><div class="grocery-amount">${esc(g.amount)}</div></div>`).join('')}</section>`).join('')||'<div class="empty">No grocery items yet.</div>';}
function groceryText(){
  const items=groceryItems(), by={};
  items.forEach(g=>{(by[g.aisle] ||= []).push(g);});
  return Object.keys(by)
    .sort((a,b)=>aisleOrder(a)-aisleOrder(b))
    .map(a=>`${aisleLabel(a)}\n` + by[a].map(g=>`- ${g.name}${g.amount?' — '+g.amount:''}`).join('\n'))
    .join('\n\n');
}
async function copyGrocery(){const text=groceryText(); if(!text){showToast('Nothing to copy');return;} try{await navigator.clipboard.writeText(text); showToast('Grocery list copied');}catch(e){const ta=document.createElement('textarea'); ta.value=text; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); ta.remove(); showToast('Grocery list copied');}}
function prepText(){const clone=E('#prepContent').cloneNode(true); clone.querySelectorAll('button,.meta-label').forEach(n=>n.remove()); return clone.innerText.replace(/\n{3,}/g,'\n\n').trim();}
async function copyPrep(){const text=prepText(); if(!text){showToast('Nothing to copy');return;} try{await navigator.clipboard.writeText(text); showToast('Prep/cook plan copied');}catch(e){const ta=document.createElement('textarea'); ta.value=text; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); ta.remove(); showToast('Prep/cook plan copied');}}
function renderNotes(){const d=domain(); const presetNotes=d.presets.map(p=>`<div class="note-card"><h3>${esc(p.label)}</h3><p>${esc(p.caption||'')}</p>${p.guardrails?.length?`<ul>${p.guardrails.map(g=>`<li>${esc(g)}</li>`).join('')}</ul>`:''}</div>`).join(''); const appNotes=(d.notes||[]).map(n=>`<div class="note-card"><h3>Build note</h3><p>${esc(n)}</p></div>`).join(''); E('#notesContent').innerHTML=appNotes+presetNotes;}

function applyPreviewClasses(){
  EA('[data-ingredient]').forEach(btn=>btn.classList.toggle('preview-member', previewIds.has(btn.dataset.ingredient)));
  EA('[data-method]').forEach(btn=>btn.classList.toggle('preview-member', previewIds.has(btn.dataset.method)));
  EA('.component-wrap').forEach(w=>{const own=w.querySelector('[data-component]')?.dataset.component; w.classList.toggle('preview-component', Boolean(previewComponent && own===previewComponent));});
}
function setPreview(str,componentId=null){previewIds=new Set(String(str||'').split(',').filter(Boolean)); previewComponent=componentId; applyPreviewClasses();}
function clearPreview(){if(previewIds.size||previewComponent){previewIds=new Set(); previewComponent=null; applyPreviewClasses();}}

function activateTab(tabName){activeTab=['build','grocery','prep'].includes(tabName)?tabName:'build'; EA('.tab-btn').forEach(b=>b.classList.toggle('active',b.dataset.tab===activeTab)); EA('.tab-panel').forEach(p=>p.classList.toggle('active',p.id===`panel-${activeTab}`)); const btn=E('#tabActionBtn'); if(btn){btn.textContent=activeTab==='build'?'Reset build':(activeTab==='grocery'?'Copy shopping list':'Copy instructions'); btn.dataset.action=activeTab==='build'?'reset':(activeTab==='grocery'?'copyGrocery':'copyPrep');}}
document.addEventListener('click',e=>{const home=e.target.closest('#homeBtn'); if(home){currentDomain=null; activeTab='build'; renderAll(); return;} const domainBtn=e.target.closest('[data-domain]'); if(domainBtn){currentDomain=domainBtn.dataset.domain; activeTab='build'; save(); renderAll(); return;} if(!currentDomain)return; const presetBtn=e.target.closest('[data-preset]'); if(presetBtn){applyPreset(presetBtn.dataset.preset); return;} const ingBtn=e.target.closest('[data-ingredient]'); if(ingBtn){toggleIngredient(ingBtn.dataset.ingredient); return;} const compBtn=e.target.closest('[data-component]'); if(compBtn){toggleComponent(compBtn.dataset.component); return;} const meth=e.target.closest('[data-method]'); if(meth){toggleMethod(meth.dataset.method); return;} const clr=e.target.closest('[data-clear-module]'); if(clr){clearModule(clr.dataset.clearModule); return;} const action=e.target.closest('#tabActionBtn'); if(action){if(action.dataset.action==='reset'){setSelected([],[]); st().basePreset=null; save(); renderAll(); return;} if(action.dataset.action==='copyGrocery'){copyGrocery(); return;} if(action.dataset.action==='copyPrep'){copyPrep(); return;}} const tab=e.target.closest('[data-tab]'); if(tab){activateTab(tab.dataset.tab);}});
document.addEventListener('mouseover',e=>{const p=e.target.closest('[data-preview]'); if(p)setPreview(p.dataset.preview,p.dataset.previewComponent||null);});
document.addEventListener('mouseout',e=>{const p=e.target.closest('[data-preview]'); if(p)clearPreview();});
E('#presetSelect')?.addEventListener('change',e=>{if(e.target.value)applyPreset(e.target.value);});

load(); renderAll();
