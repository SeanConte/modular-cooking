<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Cooking Builder 0.37</title>
<style>
:root{
  --font-body:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  --font-display:Georgia,"Times New Roman",serif;
  --font-mono:ui-monospace,SFMono-Regular,Consolas,monospace;

  --rgb-bg-0:244 241 234; --rgb-bg-1:232 226 216; --rgb-paper:255 252 246; --rgb-card:248 244 236;
  --rgb-chip:232 225 214; --rgb-chip-hover:222 214 201; --rgb-ink:33 27 21; --rgb-muted:116 106 95;
  --rgb-accent:92 78 63; --rgb-accent-2:191 168 132; --rgb-good:70 88 74; --rgb-preview:164 112 59;

  --color-bg-0:rgb(var(--rgb-bg-0)); --color-bg-1:rgb(var(--rgb-bg-1)); --color-paper:rgb(var(--rgb-paper));
  --color-card:rgb(var(--rgb-card)); --color-chip:rgb(var(--rgb-chip)); --color-chip-hover:rgb(var(--rgb-chip-hover));
  --color-ink:rgb(var(--rgb-ink)); --color-muted:rgb(var(--rgb-muted)); --color-accent:rgb(var(--rgb-accent));
  --color-accent-2:rgb(var(--rgb-accent-2)); --color-line:rgb(var(--rgb-ink) / .16); --color-line-strong:rgb(var(--rgb-ink) / .32);
  --shadow-card:0 12px 34px rgb(var(--rgb-ink) / .08); --shadow-soft:0 4px 14px rgb(var(--rgb-ink) / .04);
  --shadow-tip:0 12px 30px rgb(var(--rgb-ink) / .28);
  --radius-card:.78rem; --radius-module:.62rem; --radius-pill:999px;
}
body[data-theme="chicken"]{--rgb-accent:196 72 24; --rgb-accent-2:222 153 61;}
body[data-theme="steak"]{--rgb-accent:126 38 60; --rgb-accent-2:180 122 90;}
body[data-theme="burger"]{--rgb-accent:176 35 31; --rgb-accent-2:196 147 90;}
body[data-theme="stirfry"]{--rgb-accent:18 118 69; --rgb-accent-2:196 159 64;}

*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:var(--font-body);color:var(--color-ink);font-size:15px;line-height:1.45;
  background:linear-gradient(160deg,var(--color-bg-0),var(--color-bg-1)) fixed;min-height:100vh}
button{font-family:inherit;cursor:pointer}
header{display:flex;align-items:baseline;gap:.55rem;padding:.9rem 1.1rem .4rem}
header h1{margin:0;font-family:var(--font-display);font-size:1.5rem;letter-spacing:.01em}
header .version{font-family:var(--font-mono);font-size:.62rem;color:var(--color-muted)}

.landing{max-width:920px;margin:1.2rem auto;padding:0 1.1rem}
.builder-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:.8rem}
.builder-card{border:1px solid var(--color-line-strong);border-radius:var(--radius-card);background:var(--color-paper);
  padding:1.5rem 1rem;font-family:var(--font-display);font-size:1.15rem;box-shadow:var(--shadow-soft);transition:transform .12s}
.builder-card:hover{transform:translateY(-2px);box-shadow:var(--shadow-card)}

.topbar{display:flex;align-items:center;gap:.7rem;background:var(--color-ink);color:var(--color-paper);padding:.5rem 1.1rem}
.home-btn{border:1px solid rgb(var(--rgb-paper) / .4);background:transparent;color:var(--color-paper);border-radius:.4rem;
  font-size:.95rem;line-height:1;padding:.25rem .5rem}
.top-title{font-family:var(--font-display);font-size:1.05rem}
.tabbar{display:flex;align-items:center;gap:.4rem;padding:.55rem 1.1rem;flex-wrap:wrap;
  border-bottom:1px solid var(--color-line);background:rgb(var(--rgb-paper) / .6)}
.tab-btn{border:1px solid var(--color-line-strong);background:var(--color-paper);border-radius:var(--radius-pill);
  padding:.38rem .95rem;font-size:.78rem;font-weight:650;color:var(--color-ink)}
.tab-btn.active{background:var(--color-ink);color:var(--color-paper);border-color:var(--color-ink)}
.ghost-btn{border:1px solid var(--color-line-strong);background:transparent;border-radius:var(--radius-pill);
  padding:.38rem .85rem;font-size:.72rem;color:var(--color-accent);margin-left:auto}
.ghost-btn:hover{background:var(--color-chip)}
main{padding:.9rem 1.1rem 3rem;max-width:1480px;margin:0 auto}
.tab-panel{display:none}.tab-panel.active{display:block}

.presets-card{background:linear-gradient(180deg,var(--color-paper),rgb(var(--rgb-accent-2) / .08));
  border:1px solid var(--color-line-strong);border-radius:var(--radius-card);padding:.68rem .78rem;
  box-shadow:var(--shadow-card);margin-bottom:.85rem;display:grid;gap:.5rem}
.bar-label{font-family:var(--font-mono);font-size:.56rem;letter-spacing:.14em;text-transform:uppercase;color:var(--color-accent);font-weight:700}
.preset-group{display:flex;gap:.42rem;align-items:center;flex-wrap:wrap}
.preset-btn{position:relative;border:1px solid var(--color-line-strong);border-radius:var(--radius-pill);background:var(--color-card);
  padding:.4rem .85rem;font-size:.75rem;font-weight:650;color:var(--color-ink)}
.preset-btn:hover{background:var(--color-chip-hover)}
.preset-btn.active{background:var(--color-ink);color:var(--color-paper);border-color:var(--color-ink)}
.select-wrap{display:flex;align-items:center;gap:.45rem}
.preset-select{border:1px solid var(--color-line-strong);border-radius:var(--radius-pill);background:var(--color-card);
  color:var(--color-ink);padding:.38rem .75rem;font-size:.73rem}
.preset-select.active{background:var(--color-accent-2);border-color:var(--color-accent)}

.builder-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:.8rem}
@media(max-width:1100px){.builder-grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:640px){.builder-grid{grid-template-columns:1fr}}
.lane-title{margin:.1rem 0 .5rem;font-family:var(--font-display);font-size:1.12rem;color:var(--color-accent)}
.module{background:linear-gradient(180deg,rgb(var(--rgb-paper) / .84),rgb(var(--rgb-accent-2) / .06));
  border:1px solid var(--color-line);border-top-color:rgb(var(--rgb-accent-2) / .45);border-radius:var(--radius-module);
  padding:.62rem;margin-bottom:.6rem;box-shadow:var(--shadow-soft)}
.module-head{display:flex;justify-content:space-between;gap:.55rem;align-items:flex-start;margin-bottom:.34rem}
.module-title{font-family:var(--font-display);font-size:1.02rem;font-weight:800;line-height:1.08;color:var(--color-accent)}
.clear-module{border:0;background:transparent;color:var(--color-muted);font-family:var(--font-mono);font-size:.49rem;
  letter-spacing:.1em;text-transform:uppercase;padding:.1rem}
.clear-module:hover{color:var(--color-accent)}
.section{margin-top:.5rem}
.section-label{color:rgb(var(--rgb-accent-2));margin-bottom:.28rem;font-weight:800;font-family:var(--font-mono);
  font-size:.55rem;letter-spacing:.12em;text-transform:uppercase;filter:brightness(.8)}
.chip-grid{display:flex;flex-wrap:wrap;gap:.32rem}
.chip{position:relative;border:1px solid var(--color-line-strong);border-radius:var(--radius-pill);background:var(--color-chip);
  padding:.3rem .62rem;font-size:.72rem;font-weight:600;color:var(--color-ink);text-align:left}
.chip:hover{background:var(--color-chip-hover)}
.chip .ing-status{font-family:var(--font-mono);font-size:.5rem;letter-spacing:.06em;text-transform:uppercase;color:var(--color-accent-2);border:1px solid var(--color-line);border-radius:.5rem;padding:0 .28rem;margin-left:.2rem;vertical-align:1px}
.chip.optional .ing-status{color:var(--color-accent-2)}
.chip.alternative .ing-status{color:var(--color-accent)}
.chip .amt{font-family:var(--font-mono);font-size:.55rem;color:var(--color-muted);font-weight:650;margin-left:.22rem}
.chip.selected{background:var(--color-ink);color:var(--color-paper);border-color:var(--color-ink)}
.chip.selected .amt{color:rgb(var(--rgb-paper) / .72)}
.chip.bundle{background:rgb(var(--rgb-accent-2) / .28);border-style:dashed}
.chip.bundle.selected{background:var(--color-accent);color:var(--color-paper);border-style:solid;border-color:var(--color-accent)}
.chip.bundle.partial{outline:2px dashed rgb(var(--rgb-accent) / .5);outline-offset:1px}
.chip.preview{outline:2px solid rgb(var(--rgb-preview));outline-offset:1px}

.has-tip{position:relative}
.tip{display:none;position:absolute;z-index:40;left:0;top:calc(100% + 6px);width:240px;background:var(--color-ink);
  color:var(--color-paper);border-radius:.5rem;padding:.55rem .65rem;font-size:.68rem;font-weight:450;line-height:1.4;
  box-shadow:var(--shadow-tip);text-align:left;pointer-events:none;white-space:normal}
.has-tip:hover>.tip,.has-tip:focus-visible>.tip{display:block}
.tip-title{font-weight:800;margin-bottom:.2rem}
.tip-line{margin:.14rem 0;color:rgb(var(--rgb-paper) / .85)}
.tip-line strong{color:var(--color-paper)}

.grocery-layout{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:.75rem}
.shopping-controls{display:flex;align-items:center;gap:.7rem;flex-wrap:wrap;margin:0 0 .75rem}
.serving-control{display:flex;align-items:center;gap:.45rem;font-size:.78rem;font-weight:700}
.serving-input{width:4.6rem;border:1px solid var(--color-line-strong);border-radius:.45rem;background:var(--color-paper);
  color:var(--color-ink);padding:.34rem .45rem;font:650 .76rem var(--font-mono)}
.view-control{display:flex;align-items:center;gap:.45rem}
.view-toggle{display:inline-flex;border:1px solid var(--color-line-strong);border-radius:var(--radius-pill);overflow:hidden;background:var(--color-paper)}
.view-btn{border:0;border-right:1px solid var(--color-line);background:transparent;color:var(--color-ink);
  padding:.34rem .72rem;font-size:.72rem;font-weight:700}
.view-btn:last-child{border-right:0}.view-btn.active{background:var(--color-ink);color:var(--color-paper)}
.grocery-layout.list-view{display:block;max-width:780px}
.grocery-layout.list-view .grocery-group{background:transparent;border:0;border-radius:0;box-shadow:none;padding:0;margin:0 0 1rem}
.grocery-layout.list-view .grocery-group h3{margin:.05rem 0 .3rem}
.grocery-layout.list-view .grocery-group h3::after{height:1px}
.grocery-layout.list-view .grocery-row{padding:.38rem .08rem}
.grocery-group{background:linear-gradient(180deg,var(--color-paper),rgb(var(--rgb-accent-2) / .08));
  border:1px solid var(--color-line-strong);border-radius:var(--radius-card);padding:.68rem .78rem;box-shadow:var(--shadow-card)}
.grocery-group h3{display:flex;align-items:center;gap:.5rem;margin:.05rem 0 .42rem;font-family:var(--font-display);
  font-size:1.12rem;color:var(--color-accent)}
.grocery-group h3::after{content:"";height:2px;background:linear-gradient(90deg,var(--color-accent-2),transparent);flex:1}
.grocery-row{display:flex;justify-content:space-between;gap:1rem;padding:.34rem 0;border-top:1px solid var(--color-line)}
.grocery-row:first-of-type{border-top:0}
.grocery-name{font-weight:780;font-size:.8rem}
.grocery-amount{font-family:var(--font-mono);font-size:.62rem;color:var(--color-muted);white-space:nowrap;text-align:right}

.instruction-stack{display:grid;grid-template-columns:1fr;gap:.75rem;max-width:860px}
.instruction-block{background:linear-gradient(180deg,var(--color-paper),rgb(var(--rgb-accent-2) / .08));
  border:1px solid var(--color-line-strong);border-radius:var(--radius-card);padding:.68rem .9rem;box-shadow:var(--shadow-card)}
.instruction-block h3{margin:.02rem 0 .35rem;font-family:var(--font-display);font-size:1.25rem;color:var(--color-accent)}
.instruction-block ol{margin:.25rem 0 0;padding-left:1.2rem}
.instruction-block li{margin:.24rem 0;line-height:1.45;font-size:.88rem}
.instruction-block strong{font-weight:850}
.mix-intro{font-size:.82rem;color:var(--color-muted);margin:.1rem 0 .15rem}
.mix-list{margin:.15rem 0 .4rem;padding-left:1.15rem;columns:1}
.mix-list li{margin:.14rem 0;font-size:.85rem;line-height:1.35}
.mix-list .amt{font-family:var(--font-mono);font-size:.68rem;color:var(--color-muted)}
.empty{background:var(--color-paper);border:1px solid var(--color-line);border-radius:var(--radius-card);
  padding:1rem;color:var(--color-muted)}

.toast{position:fixed;left:50%;bottom:1.4rem;transform:translateX(-50%) translateY(20px);background:var(--color-ink);
  color:var(--color-paper);padding:.5rem .9rem;border-radius:.5rem;font-size:.75rem;opacity:0;pointer-events:none;
  transition:opacity .18s,transform .18s;z-index:60}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body data-theme="neutral">
<header><h1>Cooking Builder</h1><span class="version">0.37</span></header>

<section id="landing" class="landing"><div class="builder-cards" id="landingCards"></div></section>

<div id="appShell" hidden>
  <nav class="topbar" aria-label="Builder navigation">
    <button class="home-btn" id="homeBtn" aria-label="Home" title="Home">&#8962;</button>
    <div class="top-title"><span id="topBuilderName"></span></div>
  </nav>
  <div class="tabbar" role="tablist">
    <button class="tab-btn active" data-tab="build">Ingredients</button>
    <button class="tab-btn" data-tab="grocery">Shopping List</button>
    <button class="tab-btn" data-tab="prep">Instructions</button>
    <button class="ghost-btn" id="tabActionBtn">Reset build</button>
  </div>
  <main>
    <section class="tab-panel active" id="panel-build">
      <section class="presets-card" aria-label="Presets">
        <span class="bar-label">Presets</span>
        <div class="preset-group" id="presetButtons"></div>
        <div class="select-wrap"><label class="bar-label" for="presetSelect">More</label>
          <select id="presetSelect" class="preset-select"></select></div>
      </section>
      <div class="builder-grid" id="builderGrid"></div>
    </section>
    <section class="tab-panel" id="panel-grocery">
      <div class="shopping-controls">
        <label class="serving-control" for="servingCount">Servings
          <input class="serving-input" id="servingCount" type="number" min="1" step="1" inputmode="numeric" />
        </label>
        <div class="view-control" aria-label="Shopping list layout">
          <span class="bar-label">View</span>
          <div class="view-toggle">
            <button class="view-btn" data-shopping-view="list">List</button>
            <button class="view-btn" data-shopping-view="cards">Cards</button>
          </div>
        </div>
      </div>
      <div class="grocery-layout" id="groceryContent"></div>
    </section>
    <section class="tab-panel" id="panel-prep"><div id="prepContent"></div></section>
  </main>
</div>
<div class="toast" id="toast"></div>

<script>
'use strict';
/* =====================================================================
   Cooking Builder 0.37 — serving-aware refinement.

   THE MODEL (four layers, strictly separated):

   1. INGREDIENTS are the primitives. An ingredient is an identity plus
      shopping information. Nothing else. It carries no amounts and no
      instructions, because those depend on the role it plays.

   2. MODULES are roles. A module holds OCCURRENCES: an ingredient used
      in that module, with the amount and the prep/cook instruction that
      belong to that use. paprika-in-the-brine and paprika-in-the-dredge
      are different occurrences of the same primitive. Selection state
      is a set of occurrence keys "moduleId::ingredientId".

   3. BUNDLES and PRESETS are nothing but named sets of occurrence keys
      (presets may also carry methods). Selecting one selects its keys.
      They contain zero instruction logic.

   4. Everything downstream is DERIVED from the selected occurrences:
      - The SHOPPING LIST groups occurrences by shopping identity and
        totals the amounts.
      - The INSTRUCTIONS come from each domain's declarative PLAN: an
        ordered list of blocks, where each block draws on its modules'
        selected occurrences. A block can render the occurrence list
        (mixing modules), the per-occurrence prep lines (prep modules),
        the per-occurrence cook lines (hot modules), and conditional
        steps. Conditions are data ({any/all/none/mod/method}), never
        preset ids: a preset can vanish and the instructions still work.
   ===================================================================== */

/* ===== 1. Utilities ===== */
const E = s => document.querySelector(s);
const esc = v => String(v ?? '').replace(/[&<>"]/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[ch]));
const unique = arr => [...new Set((arr || []).filter(Boolean))];
const setEq = (a, b) => { const A=[...a].sort(), B=[...b].sort(); return A.length===B.length && A.every((x,i)=>x===B[i]); };

const FRACTIONS = [[0.125,'\u215B'],[0.167,'\u2159'],[0.25,'\u00BC'],[0.333,'\u2153'],[0.375,'\u215C'],[0.5,'\u00BD'],[0.625,'\u215D'],[0.667,'\u2154'],[0.75,'\u00BE'],[0.833,'\u215A'],[0.875,'\u215E']];
function fmtQty(q){
  if (q == null) return '';
  const whole = Math.floor(q), frac = Math.round((q - whole) * 1000) / 1000;
  if (frac === 0) return String(whole);
  const hit = FRACTIONS.find(([v]) => Math.abs(v - frac) < 0.02);
  const fracStr = hit ? hit[1] : String(frac).replace(/^0/, '');
  return whole ? `${whole}${hit ? '' : ' '}${fracStr}` : fracStr;
}

/* ===== 2. Storage (safe: falls back to memory if localStorage is unavailable) ===== */
const store = (() => {
  const mem = {};
  return {
    get(k){ try { return localStorage.getItem(k); } catch(e){ return k in mem ? mem[k] : null; } },
    set(k,v){ try { localStorage.setItem(k,v); } catch(e){ mem[k]=v; } },
  };
})();

/* ===== 3. Data primitives ===== */
// Ingredient: identity + shopping identity + description. Nothing about use.
//   opts: shopKey (dedupe key: occurrences sharing it merge onto one grocery
//         row), shopName (display name on the list), order (sort within aisle),
//         desc: {what, good, watch} shown as the ingredient's hover text.
function ing(id, name, aisle, opts = {}) {
  return { id, name, aisle,
    shopKey: opts.shopKey || id, shopName: opts.shopName || name,
    shopConvert: opts.shopConvert || null,
    order: opts.order ?? 50, desc: opts.desc || null };
}

// Occurrence: an ingredient's use inside a module.
//   qty/unit: the amount for this use (summable). opts.amt: display-only amount
//   ('a pinch', '4-6 leaves'). opts.note: qualifier shown with the amount
//   ('grated', 'minced'). opts.prep: the prep instruction for this use — a
//   string, or an array of {text, when} variants using the step DSL; the
//   first variant whose condition passes renders, and the last variant must
//   be unconditional so every build resolves to a line.
//   opts.cook: the cook instruction for this use (hot modules).
function occ(id, qty, unit, opts = {}) {
  return { id, qty: qty ?? null, unit: unit || null, range: opts.range || null,
    amt: opts.amt || null, note: opts.note || '', prep: opts.prep || '', cook: opts.cook || '',
    cookOrder: opts.cookOrder ?? 50, basis: opts.basis || 'batch', serves: opts.serves || null };
}
// Quantities normally describe a domain's base batch. An occurrence may instead
// be per-serving (bread/cheese counts), or declare its own known yield.
// Example: 1 lb flank steak is explicitly a six-sandwich quantity.
function occScale(o){
  if (o.basis === 'serving') return st()?.servings || 1;
  const basis = o.serves || domain()?.baseServings || 4;
  return (st()?.servings || basis) / basis;
}
const COUNT_UNITS = new Set(['bun','cup','clove','slice','stalk','bunch','head','can','egg','roll','piece','lemon','sprig','chile','leaf','pita','lime','orange']);
function unitBase(u){ const s = String(u); const b = s.replace(/s$/, ''); return COUNT_UNITS.has(b) ? b : s; }
function unitLabel(b, q){ return COUNT_UNITS.has(b) && q > 1 ? b + 's' : b; }
function displayUnit(unit, q){
  if (!unit || unit === 'each') return '';
  const b = unitBase(unit);
  return unitLabel(b, q);
}
function occAmount(o, scale = null){
  const factor = scale == null ? occScale(o) : scale;
  const note = o.note ? `, ${o.note}` : '';
  if (o.range && o.range.length === 2) {
    const lo = o.range[0] * factor, hi = o.range[1] * factor, unit = displayUnit(o.unit, hi);
    return `${fmtQty(lo)}–${fmtQty(hi)}${unit ? ' ' + unit : ''}${note}`;
  }
  if (o.amt) return o.amt + note;
  if (o.qty == null) return 'to taste';
  const q = o.qty * factor, unit = displayUnit(o.unit, q);
  return `${fmtQty(q)}${unit ? ' ' + unit : ''}${note}`;
}

// Bundle: a named set of occurrences inside one module. Pure shortcut.
function bundle(id, label, module, ids, opts = {}) {
  return { id, label, module, ids: unique(ids), does: opts.does || '', watch: opts.watch || '' };
}

// Preset: a named cross-module set of occurrences (+methods). Pure shortcut.
//   picks: { moduleId: [ingredientIds] } are the DEFAULTS. opts.alternatives /
//   opts.optional are flat id lists (ingredient, bundle, or method ids) naming
//   options that also work: alternatives swap for a default, optional adds on.
//   They are markers, not selections \u2014 the UI labels those chips while the
//   preset is the reference, instead of prose saying what swaps.
function preset(id, label, picks, opts = {}) {
  return { id, label, picks, methods: opts.methods || [], core: opts.core !== false,
    caption: opts.caption || '', guardrails: opts.guardrails || [],
    alternatives: unique(opts.alternatives || []), optional: unique(opts.optional || []) };
}
function method(id, label, note = '') { return { id, label, note }; }
// Method groups: methods are the app's second primitive (ingredients say WHAT,
// methods say HOW), and they are contingent on ingredients: every group is
// owned by a module (opts.module) and only appears when its condition
// (opts.when, same DSL as steps) passes — e.g. jus serving styles exist only
// when a jus is selected. exclusive:true behaves like a radio set. Selected
// methods in an unavailable group are ignored by the instructions.
function methodGroup(id, label, exclusive, methods, opts = {}) {
  return { id, label, exclusive: !!exclusive, methods, module: opts.module || null, when: opts.when || null };
}
function allMethods(d = domain()){ return (d.methodGroups || []).flatMap(g => g.methods); }
function methodGroupFor(id, d = domain()){ return (d.methodGroups || []).find(g => g.methods.some(m => m.id === id)) || null; }
// Availability is evaluated against RAW selected methods (one level deep), so
// a group may depend on another group's selection without recursion.
function groupAvailable(g){ return condOK(g.when, true); }
function effectiveMethodSet(){
  const out = new Set();
  for (const id of st().methods) { const g = methodGroupFor(id); if (!g || groupAvailable(g)) out.add(id); }
  return out;
}

// Instruction plan pieces.
//   step(text, when): conditional step. Text tokens: {mod:moduleId} -> bold
//   joined names selected in that module; {ing:id} -> bold ingredient name.
//   when: { any:[ids], all:[ids], none:[ids], modAny:moduleId(s),
//           mod:{id, any, all, none}, method:id, noMethod:id }
function step(text, when = null) { return { text, when }; }
// block(title, modules, opts): opts.list (occurrence list w/ amounts),
//   opts.intro (string or [step] — first passing wins), opts.prepLines,
//   opts.cookLines, opts.steps, opts.always (render when anything at all
//   is selected, even if own modules are empty — used by Assembly).
const BLOCK_OPTS = ['list','intro','prepLines','cookLines','preSteps','steps','always'];
function block(title, modules, opts = {}) {
  for (const k of Object.keys(opts)) if (!BLOCK_OPTS.includes(k))
    console.warn(`block "${title}": unknown option "${k}" would be silently dropped`);
  return { title, modules: modules || [], list: !!opts.list, intro: opts.intro || null,
    prepLines: !!opts.prepLines, cookLines: !!opts.cookLines,
    preSteps: opts.preSteps || [], steps: opts.steps || [], always: !!opts.always };
}

/* ===== 5. Data access helpers ===== */
let currentDomain = null, activeTab = 'build';
let shoppingView = store.get('cb30.shoppingView') || 'list';
if (!['list','cards'].includes(shoppingView)) shoppingView = 'list';
const state = {};
for (const k of Object.keys(DOMAINS)) state[k] = {
  selectedKeys:new Set(), methods:new Set(), basePreset:null, servings:DOMAINS[k].defaultServings || 4
};

function domain(){ return DOMAINS[currentDomain]; }
function st(){ return state[currentDomain]; }
function servingScale(d = domain()){
  const base = d?.baseServings || 4, servings = st()?.servings || base;
  return servings / base;
}
function setServings(value){
  const n = Math.max(1, Math.round(Number(value) || (domain().defaultServings || 4)));
  st().servings = n;
  save(); renderAll();
}
function catalog(id){ return domain().ingredients[id]; }
function ingName(id){ return catalog(id)?.name || id; }
function key(mid, id){ return `${mid}::${id}`; }

function moduleOccs(mid, d = domain()){
  const m = d.modules[mid]; if (!m) return [];
  return (m.sections || []).flatMap(sec => sec.items || []);
}
function occFor(mid, id, d = domain()){ return moduleOccs(mid, d).find(o => o.id === id) || null; }
function selectedOccs(mid){ return moduleOccs(mid).filter(o => st().selectedKeys.has(key(mid, o.id))); }
function selectedInModule(mid){ return selectedOccs(mid).map(o => o.id); }
function selectedIdSet(){
  const ids = new Set();
  st().selectedKeys.forEach(k => { const id = String(k).split('::')[1]; if (catalog(id)) ids.add(id); });
  return ids;
}
function anythingSelected(){ return st().selectedKeys.size > 0; }

function bundleKeys(b, d = domain()){ return b.ids.map(id => key(b.module, id)); }
function moduleBundles(mid, d = domain()){ return Object.values(d.bundles || {}).filter(b => b.module === mid); }
function bundleComplete(b){ const ks = bundleKeys(b); return ks.length > 0 && ks.every(k => st().selectedKeys.has(k)); }
// Bundles are mutually exclusive across their whole module: at most one is
// ever "active". If the selection completes several (e.g. one bundle is a
// subset of another), the maximal one is the identity in play: strict
// subsets are suppressed, then the largest remaining wins.
function activeBundleId(mid){
  const comp = moduleBundles(mid).filter(bundleComplete);
  if (!comp.length) return null;
  const idsOf = b => new Set(b.ids);
  const strictSubset = (a, c) => a.ids.length < c.ids.length && a.ids.every(id => idsOf(c).has(id));
  const cands = comp.filter(b => !comp.some(c => c !== b && strictSubset(b, c)));
  cands.sort((a, b) => b.ids.length - a.ids.length);
  return cands[0].id;
}
function bundleStatus(b){
  if (activeBundleId(b.module) === b.id) return 'on';
  const keys = bundleKeys(b);
  const hit = keys.filter(k => st().selectedKeys.has(k)).length;
  // complete-but-suppressed (a subset of the active identity) reads as off
  return (hit === 0 || hit === keys.length) ? 'off' : 'partial';
}
// Siblings = every other bundle in the same module.
function bundleSiblings(b, d = domain()){ return moduleBundles(b.module, d).filter(x => x.id !== b.id).map(x => x.id); }
function presetKeys(p, d = domain()){
  return Object.entries(p.picks || {}).flatMap(([mid, ids]) => (ids || []).map(id => key(mid, id)));
}
function presetById(id){ return domain().presets.find(p => p.id === id); }
// The reference preset for status markers: the last preset applied (basePreset)
// even after the user deviates, else an exact match if one exists.
function referencePreset(){
  return (st().basePreset && presetById(st().basePreset)) || selectedPresetExact() || null;
}
function presetStatus(id){
  const p = referencePreset(); if (!p) return '';
  if (p.optional.includes(id)) return 'optional';
  if (p.alternatives.includes(id)) return 'alternative';
  return '';
}
function statusMark(id){
  const s = presetStatus(id);
  return s ? ` <span class="ing-status">${s === 'optional' ? 'Optional' : 'Alt'}</span>` : '';
}
function selectedPresetExact(){
  return domain().presets.find(p =>
    setEq(st().selectedKeys, new Set(presetKeys(p))) && setEq(effectiveMethodSet(), new Set(p.methods || [])));
}

/* ===== 6. Selection actions ===== */
function applyPreset(id){
  const p = presetById(id); if (!p) return;
  st().selectedKeys = new Set(presetKeys(p));
  st().methods = new Set((p.methods || []).filter(m => allMethods().some(x => x.id === m)));
  st().basePreset = id;
  save(); renderAll();
}
function toggleIngredient(k){
  if (st().selectedKeys.has(k)) st().selectedKeys.delete(k);
  else {
    const mid = String(k).split('::')[0];
    if (domain().modules[mid]?.exclusive)
      [...st().selectedKeys].forEach(x => { if (String(x).startsWith(`${mid}::`)) st().selectedKeys.delete(x); });
    st().selectedKeys.add(k);
  }
  save(); renderAll();
}
function toggleBundle(id){
  const b = domain().bundles[id]; if (!b) return;
  const keys = bundleKeys(b);
  if (bundleStatus(b) === 'on') { keys.forEach(k => st().selectedKeys.delete(k)); }
  else {
    const mine = new Set(keys);
    bundleSiblings(b).forEach(sid => bundleKeys(domain().bundles[sid])
      .forEach(k => { if (!mine.has(k)) st().selectedKeys.delete(k); }));
    keys.forEach(k => st().selectedKeys.add(k));
  }
  save(); renderAll();
}
function toggleMethod(id){
  if (st().methods.has(id)) st().methods.delete(id);
  else {
    const g = methodGroupFor(id);
    if (g && g.exclusive) g.methods.forEach(m => st().methods.delete(m.id));
    st().methods.add(id);
  }
  save(); renderAll();
}
function clearModule(mid){
  [...st().selectedKeys].forEach(k => { if (String(k).startsWith(`${mid}::`)) st().selectedKeys.delete(k); });
  save(); renderAll();
}
function resetBuild(){
  st().selectedKeys = new Set(); st().methods = new Set(); st().basePreset = null;
  save(); renderAll();
}

/* ===== 7. Persistence ===== */
function save(){
  if (currentDomain) store.set('cb30.domain', currentDomain);
  const out = {};
  store.set('cb30.shoppingView', shoppingView);
  for (const [k, v] of Object.entries(state))
    out[k] = { selectedKeys:[...v.selectedKeys], methods:[...v.methods], basePreset:v.basePreset, servings:v.servings };
  store.set('cb30.state', JSON.stringify(out));
}
function load(){
  try {
    const raw = JSON.parse(store.get('cb30.state') || '{}');
    for (const k of Object.keys(DOMAINS)) {
      if (!raw[k]) continue;
      const d = DOMAINS[k];
      state[k].selectedKeys = new Set((raw[k].selectedKeys || []).filter(x => {
        const [mid, id] = String(x).split('::');
        return d.modules[mid] && occFor(mid, id, d);
      }));
      state[k].methods = new Set((raw[k].methods || []).filter(m => allMethods(d).some(x => x.id === m)));
      state[k].basePreset = raw[k].basePreset || null;
      const savedServings = Number(raw[k].servings);
      state[k].servings = Number.isFinite(savedServings) && savedServings >= 1 ? Math.round(savedServings) : (d.defaultServings || 4);
    }
  } catch (e) { /* fresh start */ }
  for (const [k, d] of Object.entries(DOMAINS)) {
    if (!state[k].selectedKeys.size && d.defaultPreset) {
      const p = d.presets.find(x => x.id === d.defaultPreset);
      if (p) {
        state[k].selectedKeys = new Set(Object.entries(p.picks || {})
          .flatMap(([mid, ids]) => ids.map(id => `${mid}::${id}`)));
        state[k].methods = new Set(p.methods || []);
        state[k].basePreset = p.id;
      }
    }
  }
}

/* ===== 8. Conditions and tokens ===== */
// Resolve an occurrence line: plain string, or first matching conditional variant.
function occText(line){
  if (!line) return '';
  if (typeof line === 'string') return line;
  const hit = line.find(v => condOK(v.when));
  return hit ? hit.text : '';
}
function condOK(when, rawMethods = false){
  if (!when) return true;
  const sel = selectedIdSet();
  if (when.any  && !when.any.some(id => sel.has(id)))  return false;
  if (when.all  && !when.all.every(id => sel.has(id))) return false;
  if (when.none &&  when.none.some(id => sel.has(id))) return false;
  if (when.modAny  && ![].concat(when.modAny).some(m => selectedInModule(m).length))  return false;
  if (when.modAll  && ![].concat(when.modAll).every(m => selectedInModule(m).length)) return false;
  if (when.modNone &&  [].concat(when.modNone).some(m => selectedInModule(m).length)) return false;
  if (when.mod) for (const spec of [].concat(when.mod)) {
    const ids = new Set(selectedInModule(spec.id));
    if (spec.any  && !spec.any.some(i => ids.has(i)))  return false;
    if (spec.all  && !spec.all.every(i => ids.has(i))) return false;
    if (spec.none &&  spec.none.some(i => ids.has(i))) return false;
  }
  const meth = rawMethods ? st().methods : effectiveMethodSet();
  if (when.method    && ![].concat(when.method).some(m => meth.has(m)))   return false;
  if (when.methodAll && ![].concat(when.methodAll).every(m => meth.has(m))) return false;
  if (when.noMethod  &&  [].concat(when.noMethod).some(m => meth.has(m)))  return false;
  return true;
}
// wrap: fn(name) -> emphasized name ('<strong>x</strong>' for HTML, 'x' for text)
function renderTokens(text, wrap){
  return String(text)
    .replace(/\{mod:([a-zA-Z]+)\}/g, (_, mid) => {
      const names = selectedInModule(mid).map(ingName);
      return names.length ? names.map(wrap).join(', ') : 'the selected items';
    })
    .replace(/\{ing:([a-zA-Z]+)\}/g, (_, id) => wrap(ingName(id)));
}

/* ===== 9. Instruction engine (neutral model -> HTML / text) ===== */
function buildInstructionModel(){
  const blocks = [];
  for (const b of domain().plan || []) {
    const occs = (b.modules || []).flatMap(mid => selectedOccs(mid).map(o => ({ mid, o })));
    if (!b.always && !occs.length) continue;
    if (b.always && !anythingSelected()) continue;

    let intro = null;
    if (b.list && occs.length) {
      if (typeof b.intro === 'string') intro = b.intro;
      else if (Array.isArray(b.intro)) intro = (b.intro.find(s => condOK(s.when)) || {}).text || null;
    }
    const listItems = b.list ? occs.map(({ o }) => ({ name: ingName(o.id), amount: occAmount(o) })) : [];

    const lines = [];
    for (const s of b.preSteps || []) if (condOK(s.when)) lines.push({ text: s.text });
    if (b.prepLines) for (const { o } of occs) { const t = occText(o.prep); if (t) lines.push({ text: t, name: ingName(o.id) }); }
    if (b.cookLines) for (const { o } of [...occs].sort((a,b) => a.o.cookOrder - b.o.cookOrder)) { const t = occText(o.cook); if (t) lines.push({ text: t, name: ingName(o.id) }); }
    for (const s of b.steps || []) if (condOK(s.when)) lines.push({ text: s.text });

    if (!listItems.length && !lines.length) continue;
    blocks.push({ title: b.title, intro, listItems, lines });
  }
  return blocks;
}
function instructionsHTML(){
  const model = buildInstructionModel();
  if (!model.length) return '<div class="empty">Choose a preset or ingredients to generate instructions.</div>';
  const wrap = n => `<strong>${esc(n)}</strong>`;
  const line = l => renderTokens(l.name ? l.text.replace(/\{name\}/g, `<strong>${esc(l.name)}</strong>`) : l.text, wrap);
  return `<div class="instruction-stack">${model.map(b => `
    <div class="instruction-block"><h3>${esc(b.title)}</h3>
      ${b.intro ? `<div class="mix-intro">${esc(b.intro)}</div>` : ''}
      ${b.listItems.length ? `<ul class="mix-list">${b.listItems.map(i =>
        `<li><strong>${esc(i.name)}</strong> <span class="amt">(${esc(i.amount)})</span></li>`).join('')}</ul>` : ''}
      ${b.lines.length ? `<ol>${b.lines.map(l => `<li>${line(l)}</li>`).join('')}</ol>` : ''}
    </div>`).join('')}</div>`;
}
function instructionsText(){
  const wrap = n => n;
  return buildInstructionModel().map(b => {
    const parts = [b.title.toUpperCase()];
    if (b.intro) parts.push(b.intro);
    b.listItems.forEach(i => parts.push(`  - ${i.name} (${i.amount})`));
    b.lines.forEach((l, i) => parts.push(`  ${i + 1}. ${renderTokens(l.name ? l.text.replace(/\{name\}/g, l.name) : l.text, wrap)}`));
    return parts.join('\n');
  }).join('\n\n');
}

/* ===== 10. Shopping engine (neutral model -> HTML / text) ===== */
function buildShoppingModel(){
  const d = domain();
  const groups = new Map(); // shopKey -> {cat, occs:[]}
  for (const mid of Object.keys(d.modules)) for (const o of selectedOccs(mid)) {
    const cat = catalog(o.id); if (!cat) continue;
    const g = groups.get(cat.shopKey) || { cat, occs: [] };
    g.occs.push({o, cat}); groups.set(cat.shopKey, g);
  }
  const aisleMap = new Map();
  for (const g of groups.values()) {
    const aisle = d.aisles[g.cat.aisle] || { label: g.cat.aisle, order: 99 };
    const a = aisleMap.get(g.cat.aisle) || { label: aisle.label, order: aisle.order, rows: [] };
    a.rows.push({ name: g.cat.shopName, order: g.cat.order, amount: shoppingAmount(g) });
    aisleMap.set(g.cat.aisle, a);
  }
  return [...aisleMap.values()].sort((x, y) => x.order - y.order)
    .map(a => ({ label: a.label, rows: a.rows.sort((x, y) => x.order - y.order || x.name.localeCompare(y.name)) }));
}
// Shopping amounts are calculated, never declared: sum the quantities of every
// selected occurrence sharing a shopKey, per unit; unlike-unit parts join with +.
function shoppingAmount(g){
  const byUnit = new Map(); const other = [];
  const add = (b, lo, hi = lo, roundUp = false) => {
    const cur = byUnit.get(b) || {lo:0, hi:0, roundUp:false};
    cur.lo += lo; cur.hi += hi; cur.roundUp = cur.roundUp || roundUp; byUnit.set(b, cur);
  };
  const measure = (o, cat, lo, hi = lo) => {
    const base = unitBase(o.unit), conv = cat.shopConvert && cat.shopConvert[base];
    if (conv) add(unitBase(conv.unit), lo * conv.factor, hi * conv.factor, !!conv.roundUp);
    else add(base, lo, hi);
  };
  for (const {o, cat} of g.occs) {
    const scale = occScale(o);
    if (o.range && o.range.length === 2 && o.unit) {
      measure(o, cat, o.range[0] * scale, o.range[1] * scale);
    } else if (typeof o.qty === 'number' && o.unit) {
      measure(o, cat, o.qty * scale);
    } else {
      other.push(occAmount(o, scale));
    }
  }
  const measured = [...byUnit.entries()].map(([b, q]) => {
    const lo = q.roundUp ? Math.ceil(q.lo - 1e-9) : q.lo;
    const hi = q.roundUp ? Math.ceil(q.hi - 1e-9) : q.hi;
    const label = b === 'each' ? '' : unitLabel(b, hi);
    const qty = Math.abs(lo - hi) < 1e-9 ? fmtQty(lo) : `${fmtQty(lo)}–${fmtQty(hi)}`;
    return label ? `${qty} ${label}` : qty;
  });
  const extras = unique(other).filter(x => !(measured.length && x === 'to taste'));
  const parts = measured.concat(extras);
  return parts.length ? parts.join(' + ') : 'as needed';
}
function shoppingHTML(){
  const model = buildShoppingModel();
  if (!model.length) return '<div class="empty">Choose a preset or ingredients to build a shopping list.</div>';
  return model.map(a => `<div class="grocery-group"><h3>${esc(a.label)}</h3>${a.rows.map(r =>
    `<div class="grocery-row"><span class="grocery-name">${esc(r.name)}</span><span class="grocery-amount">${esc(r.amount)}</span></div>`).join('')}</div>`).join('');
}
function shoppingText(){
  const body = buildShoppingModel().map(a =>
    [a.label.toUpperCase(), ...a.rows.map(r => `  - ${r.name} \u2014 ${r.amount}`)].join('\n')).join('\n\n');
  return body ? `SERVINGS: ${st().servings}\n\n${body}` : '';
}

/* ===== 11. Data validation (dev aid; warns in console, never blocks) ===== */
function validateData(){
  const problems = [];
  for (const [dk, d] of Object.entries(DOMAINS)) {
    const prepModules = new Set(), planModules = new Set();
    for (const b of d.plan || []) for (const mid of b.modules || []) {
      planModules.add(mid); if (b.prepLines) prepModules.add(mid);
    }
    for (const [mid, m] of Object.entries(d.modules)) {
      for (const o of moduleOccs(mid, d)) {
        if (!d.ingredients[o.id]) problems.push(`${dk}: occurrence ${mid}::${o.id} has no catalog ingredient`);
        const occLineOK = line => typeof line === 'string' ? !!line : Array.isArray(line) && line.length > 0;
        if (prepModules.has(mid) && !occLineOK(o.prep)) problems.push(`${dk}: ${mid}::${o.id} is in a prep-line module but has no prep instruction`);
        for (const kind of ['prep','cook'])
          if (Array.isArray(o[kind]) && (!o[kind].length || o[kind][o[kind].length - 1].when))
            problems.push(`${dk}: ${mid}::${o.id} ${kind} variants must end with an unconditional default`);
      }
      for (const sec of m.sections || []) for (const bid of sec.bundles || []) {
        const b = d.bundles[bid];
        if (!b) { problems.push(`${dk}: module ${mid} references unknown bundle ${bid}`); continue; }
        if (b.module !== mid) problems.push(`${dk}: bundle ${bid} is declared for ${b.module} but placed in ${mid}`);
        for (const id of b.ids) if (!occFor(mid, id, d)) problems.push(`${dk}: bundle ${bid} references ${mid}::${id}, which has no occurrence`);
      }
    }
    for (const p of d.presets || []) {
      for (const [mid, ids] of Object.entries(p.picks || {})) {
        if (!d.modules[mid]) { problems.push(`${dk}: preset ${p.id} picks unknown module ${mid}`); continue; }
        if (d.modules[mid].exclusive && ids.length > 1)
          problems.push(`${dk}: preset ${p.id} picks ${ids.length} items in exclusive module ${mid}`);
        for (const id of ids) if (!occFor(mid, id, d)) problems.push(`${dk}: preset ${p.id} picks ${mid}::${id}, which has no occurrence`);
      }
      const dAll = (d.methodGroups || []).flatMap(g => g.methods);
      for (const m of p.methods || []) if (!dAll.some(x => x.id === m))
        problems.push(`${dk}: preset ${p.id} uses unknown method ${m}`);
      for (const g of d.methodGroups || []) if (g.exclusive) {
        const n = (p.methods || []).filter(m => g.methods.some(x => x.id === m)).length;
        if (n > 1) problems.push(`${dk}: preset ${p.id} selects ${n} methods in exclusive group ${g.id}`);
      }
    }
    for (const [mid] of Object.entries(d.modules)) {
      const inLane = (d.lanes || []).some(l => l.modules.includes(mid));
      if (!inLane) problems.push(`${dk}: module ${mid} is not placed in any lane`);
    }
    for (const [iid, c] of Object.entries(d.ingredients))
      if (!c.desc || !c.desc.what || !c.desc.good || !c.desc.watch)
        problems.push(`${dk}: ingredient ${iid} is missing its description (what/good/watch)`);
    for (const g of d.methodGroups || []) {
      if (!g.module || !d.modules[g.module])
        problems.push(`${dk}: method group ${g.id} is not attached to an existing module`);
    }
    // A preset's methods must belong to groups whose condition passes under the
    // preset's own picks and methods; otherwise the preset selects a dead chip.
    const pCondOK = (when, picks, methods) => {
      if (!when) return true;
      const ids = new Set(Object.values(picks || {}).flat());
      const inMod = mid => (picks || {})[mid] || [];
      if (when.any  && !when.any.some(id => ids.has(id)))  return false;
      if (when.all  && !when.all.every(id => ids.has(id))) return false;
      if (when.none &&  when.none.some(id => ids.has(id))) return false;
      if (when.modAny  && ![].concat(when.modAny).some(m => inMod(m).length))  return false;
      if (when.modAll  && ![].concat(when.modAll).every(m => inMod(m).length)) return false;
      if (when.modNone &&  [].concat(when.modNone).some(m => inMod(m).length)) return false;
      if (when.mod) for (const spec of [].concat(when.mod)) {
        const s = new Set(inMod(spec.id));
        if (spec.any  && !spec.any.some(i => s.has(i)))  return false;
        if (spec.all  && !spec.all.every(i => s.has(i))) return false;
        if (spec.none &&  spec.none.some(i => s.has(i))) return false;
      }
      if (when.method    && ![].concat(when.method).some(m => methods.includes(m)))   return false;
      if (when.methodAll && ![].concat(when.methodAll).every(m => methods.includes(m))) return false;
      if (when.noMethod  &&  [].concat(when.noMethod).some(m => methods.includes(m)))  return false;
      return true;
    };
    for (const p of d.presets || []) for (const m of p.methods || []) {
      const g = (d.methodGroups || []).find(x => x.methods.some(y => y.id === m));
      if (g && !pCondOK(g.when, p.picks, p.methods || []))
        problems.push(`${dk}: preset ${p.id} selects method ${m}, but group ${g.id} is unavailable under its own picks`);
    }
    // Plan integrity: conditions and text tokens must reference real ids. A
    // condition pointing at a nonexistent id never fires and never errors.
    const dMeths = new Set((d.methodGroups || []).flatMap(g => g.methods.map(m => m.id)));
    const checkWhen = (when, where) => {
      if (!when) return;
      for (const id of [...(when.any||[]), ...(when.all||[]), ...(when.none||[])])
        if (!d.ingredients[id]) problems.push(`${dk}: ${where} conditions on unknown ingredient ${id}`);
      for (const m of [].concat(when.modAny||[], when.modAll||[], when.modNone||[]))
        if (!d.modules[m]) problems.push(`${dk}: ${where} conditions on unknown module ${m}`);
      for (const spec of [].concat(when.mod||[])) {
        if (!d.modules[spec.id]) problems.push(`${dk}: ${where} conditions on unknown module ${spec.id}`);
        for (const id of [...(spec.any||[]), ...(spec.all||[]), ...(spec.none||[])])
          if (!d.ingredients[id]) problems.push(`${dk}: ${where} conditions on unknown ingredient ${id}`);
      }
      for (const m of [].concat(when.method||[], when.methodAll||[], when.noMethod||[]))
        if (!dMeths.has(m)) problems.push(`${dk}: ${where} conditions on unknown method ${m}`);
    };
    const checkTokens = (text, where, when) => {
      for (const [, kind, id] of text.matchAll(/\{(ing|mod):(\w+)\}/g)) {
        if (kind === 'ing' && !d.ingredients[id]) problems.push(`${dk}: ${where} text references unknown ingredient ${id}`);
        if (kind === 'mod') {
          if (!d.modules[id]) { problems.push(`${dk}: ${where} text references unknown module ${id}`); continue; }
          // The condition must guarantee the module is nonempty, or the token
          // renders as a placeholder in real instructions.
          const w = when || {};
          const modAnyArr = [].concat(w.modAny||[]);
          const direct = (modAnyArr.length === 1 && modAnyArr[0] === id) || [].concat(w.modAll||[]).includes(id)
            || [].concat(w.mod||[]).some(s => s.id === id && ((s.any||[]).length || (s.all||[]).length));
          const viaMethod = w.method && [].concat(w.method).every(m => {
            const g = (d.methodGroups || []).find(x => x.methods.some(y => y.id === m));
            return g && g.when && ([].concat(g.when.modAny||[]).includes(id) || [].concat(g.when.modAll||[]).includes(id));
          });
          if (!direct && !viaMethod)
            problems.push(`${dk}: ${where} names {mod:${id}} but its condition does not guarantee a selection there`);
        }
      }
    };
    for (const b of d.plan || []) {
      for (const m of b.modules || []) if (!d.modules[m])
        problems.push(`${dk}: block "${b.title}" lists unknown module ${m}`);
      for (const s of [...(b.preSteps||[]), ...(b.steps||[])]) {
        checkWhen(s.when, `block "${b.title}" step`);
        checkTokens(s.text, `block "${b.title}" step`, s.when);
      }
    }
    for (const g of d.methodGroups || []) checkWhen(g.when, `method group ${g.id}`);
    // Alternatives/optional must name real options (ingredient, bundle, or
    // method ids) that are not already part of the preset's defaults.
    for (const p of d.presets || []) {
      const own = new Set(presetKeys(p).map(k => k.split('::')[1]).concat(p.methods || []));
      for (const [field, ids] of [['alternatives', p.alternatives], ['optional', p.optional]]) {
        for (const id of ids) {
          if (!d.ingredients[id] && !d.bundles[id] && !dMeths.has(id))
            problems.push(`${dk}: preset ${p.id} ${field} names unknown id ${id}`);
          if (own.has(id))
            problems.push(`${dk}: preset ${p.id} ${field} lists ${id}, which is already a default`);
        }
      }
    }
    for (const [mid, m] of Object.entries(d.modules)) for (const sec of m.sections || []) for (const o of sec.items || [])
      for (const kind of ['prep','cook']) if (Array.isArray(o[kind]))
        for (const v of o[kind]) checkWhen(v.when, `${mid}::${o.id} ${kind} variant`);
  }
  if (problems.length) console.warn(`Cooking Builder data validation: ${problems.length} problem(s)\n` + problems.join('\n'));
  return problems;
}

/* ===== 12. Rendering ===== */
function tipHtml(title, lines){
  const body = (lines || []).filter(Boolean)
    .map(x => Array.isArray(x) ? `<div class="tip-line"><strong>${esc(x[0])}:</strong> ${esc(x[1])}</div>`
                               : `<div class="tip-line">${esc(x)}</div>`).join('');
  return `<span class="tip"><div class="tip-title">${esc(title)}</div>${body}</span>`;
}
function chipHtml(mid, o){
  const k = key(mid, o.id), sel = st().selectedKeys.has(k), cat = catalog(o.id), d = cat && cat.desc;
  const tip = d ? tipHtml(ingName(o.id), [d.what, d.good && ['Good for', d.good], d.watch && ['Watch', d.watch]]) : '';
  return `<button class="chip ${d ? 'has-tip' : ''} ${sel ? 'selected' : ''} ${presetStatus(o.id)}" data-key="${esc(k)}">${esc(ingName(o.id))}<span class="amt">(${esc(occAmount(o))})</span>${statusMark(o.id)}${tip}</button>`;
}
function bundleChipHtml(id){
  const b = domain().bundles[id]; if (!b) return '';
  const status = bundleStatus(b);
  const tip = tipHtml(b.label, [b.does, ['Includes', b.ids.map(ingName).join(', ')], b.watch && ['Watch', b.watch]]);
  return `<button class="chip bundle has-tip ${status === 'on' ? 'selected' : ''} ${status === 'partial' ? 'partial' : ''} ${presetStatus(id)}"
    data-bundle="${esc(id)}" data-preview-keys="${esc(bundleKeys(b).join(','))}">${esc(b.label)}${statusMark(id)}${tip}</button>`;
}
function methodChipHtml(m){
  const sel = st().methods.has(m.id);
  return `<button class="chip has-tip ${sel ? 'selected' : ''} ${presetStatus(m.id)}" data-method="${esc(m.id)}">${esc(m.label)}${statusMark(m.id)}${m.note ? tipHtml(m.label, [m.note]) : ''}</button>`;
}
function moduleHtml(mid){
  const m = domain().modules[mid]; if (!m) return '';
  const sections = (m.sections || []).map(sec => `<div class="section"><div class="section-label">${esc(sec.label || 'Options')}</div>
        ${sec.bundles ? `<div class="chip-grid">${sec.bundles.map(bundleChipHtml).join('')}</div>` : ''}
        ${sec.items ? `<div class="chip-grid" style="margin-top:${sec.bundles ? '.35rem' : '0'}">${sec.items.map(o => chipHtml(mid, o)).join('')}</div>` : ''}
      </div>`).join('');
  const groups = (domain().methodGroups || []).filter(g => g.module === mid && groupAvailable(g))
    .map(g => `<div class="section"><div class="section-label">${esc(g.label)}</div><div class="chip-grid">${g.methods.map(methodChipHtml).join('')}</div></div>`).join('');
  return `<article class="module"><div class="module-head"><div class="module-title">${esc(m.title)}</div>
    <button class="clear-module" data-clear-module="${esc(mid)}">Clear</button></div>${sections}${groups}</article>`;
}
function presetButtonHtml(p, exact){
  const optionName = id => ingName(id) !== id ? ingName(id)
    : (domain().bundles[id] ? domain().bundles[id].label
    : ((allMethods().find(x => x.id === id) || {}).label || id));
  const tip = tipHtml(p.label, [p.caption,
    ['Selects', presetKeys(p).map(k => ingName(k.split('::')[1])).filter(Boolean).slice(0, 14).join(', ') + (presetKeys(p).length > 14 ? '\u2026' : '')],
    (p.methods || []).length && ['Methods', p.methods.map(m => (allMethods().find(x => x.id === m) || {}).label || m).join(', ')],
    p.optional.length && ['Optional', p.optional.map(optionName).join(', ')],
    p.alternatives.length && ['Alternatives', p.alternatives.map(optionName).join(', ')],
    ...(p.guardrails || []).map(g => ['Guardrail', g])]);
  return `<button class="preset-btn has-tip ${exact?.id === p.id ? 'active' : ''}" data-preset="${esc(p.id)}"
    data-preview-keys="${esc(presetKeys(p).join(','))}">${esc(p.label)}${tip}</button>`;
}
function renderPresets(){
  const d = domain(), exact = selectedPresetExact();
  const core = d.presets.filter(p => p.core), more = d.presets.filter(p => !p.core);
  E('#presetButtons').innerHTML = core.map(p => presetButtonHtml(p, exact)).join('');
  const sel = E('#presetSelect');
  sel.innerHTML = '<option value="">Other presets\u2026</option>' +
    more.map(p => `<option value="${esc(p.id)}" ${exact?.id === p.id ? 'selected' : ''}>${esc(p.label)}</option>`).join('');
  sel.classList.toggle('active', more.some(p => exact?.id === p.id));
}
function renderBuild(){
  E('#builderGrid').innerHTML = domain().lanes.map(lane =>
    `<section class="lane"><h2 class="lane-title">${esc(lane.title)}</h2>${lane.modules.map(moduleHtml).join('')}</section>`).join('');
}
function renderLanding(){
  const on = !!currentDomain;
  E('#landing').hidden = on; E('#appShell').hidden = !on;
  E('#landingCards').innerHTML = Object.values(DOMAINS).map(d =>
    `<button class="builder-card" data-domain="${esc(d.id)}">${esc(d.label)}</button>`).join('');
}
function activateTab(name){
  activeTab = ['build', 'grocery', 'prep'].includes(name) ? name : 'build';
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b.dataset.tab === activeTab));
  document.querySelectorAll('.tab-panel').forEach(p => p.classList.toggle('active', p.id === `panel-${activeTab}`));
  const btn = E('#tabActionBtn');
  btn.textContent = activeTab === 'build' ? 'Reset build' : (activeTab === 'grocery' ? 'Copy shopping list' : 'Copy instructions');
}
function renderAll(){
  renderLanding();
  if (!currentDomain) { document.body.dataset.theme = 'neutral'; return; }
  document.body.dataset.theme = domain().theme;
  E('#topBuilderName').textContent = domain().label;
  renderPresets(); renderBuild();
  E('#servingCount').value = st().servings;
  const grocery = E('#groceryContent');
  grocery.className = `grocery-layout${shoppingView === 'list' ? ' list-view' : ''}`;
  grocery.innerHTML = shoppingHTML();
  document.querySelectorAll('[data-shopping-view]').forEach(b =>
    b.classList.toggle('active', b.dataset.shoppingView === shoppingView));
  E('#prepContent').innerHTML = instructionsHTML();
  activateTab(activeTab);
}
function showToast(msg){
  const t = E('#toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(showToast.timer); showToast.timer = setTimeout(() => t.classList.remove('show'), 1400);
}
function copyText(text, label){
  const done = () => showToast(`${label} copied`);
  if (navigator.clipboard && navigator.clipboard.writeText) { navigator.clipboard.writeText(text).then(done, done); return; }
  try {
    const ta = document.createElement('textarea'); ta.value = text; document.body.appendChild(ta);
    ta.select(); document.execCommand('copy'); document.body.removeChild(ta); done();
  } catch (e) { showToast('Copy failed'); }
}

/* ===== 13. Events & init ===== */
function setPreview(keysCsv, on){
  const keys = new Set((keysCsv || '').split(',').filter(Boolean));
  document.querySelectorAll('.chip[data-key]').forEach(el =>
    el.classList.toggle('preview', on && keys.has(el.dataset.key)));
}
document.addEventListener('click', ev => {
  const t = ev.target.closest('[data-domain],[data-tab],[data-preset],[data-bundle],[data-key],[data-method],[data-clear-module],[data-shopping-view],#homeBtn,#tabActionBtn');
  if (!t) return;
  if (t.dataset.domain) { currentDomain = t.dataset.domain; activeTab = 'build'; save(); renderAll(); return; }
  if (t.id === 'homeBtn') { currentDomain = null; store.set('cb30.domain', ''); renderAll(); return; }
  if (t.dataset.tab) { activateTab(t.dataset.tab); return; }
  if (t.dataset.shoppingView) {
    shoppingView = ['list','cards'].includes(t.dataset.shoppingView) ? t.dataset.shoppingView : 'list';
    save(); renderAll(); return;
  }
  if (t.id === 'tabActionBtn') {
    if (activeTab === 'build') resetBuild();
    else if (activeTab === 'grocery') copyText(shoppingText(), 'Shopping list');
    else copyText(instructionsText(), 'Instructions');
    return;
  }
  if (t.dataset.preset) { applyPreset(t.dataset.preset); return; }
  if (t.dataset.bundle) { toggleBundle(t.dataset.bundle); return; }
  if (t.dataset.key) { toggleIngredient(t.dataset.key); return; }
  if (t.dataset.method) { toggleMethod(t.dataset.method); return; }
  if (t.dataset.clearModule) { clearModule(t.dataset.clearModule); return; }
});
document.addEventListener('change', ev => {
  if (ev.target.id === 'presetSelect' && ev.target.value) applyPreset(ev.target.value);
  if (ev.target.id === 'servingCount') setServings(ev.target.value);
});
document.addEventListener('mouseover', ev => {
  const t = ev.target.closest('[data-preview-keys]'); if (t) setPreview(t.dataset.previewKeys, true);
});
document.addEventListener('mouseout', ev => {
  const t = ev.target.closest('[data-preview-keys]'); if (t) setPreview('', false);
});

validateData();
load();
currentDomain = store.get('cb30.domain') || null;
if (currentDomain && !DOMAINS[currentDomain]) currentDomain = null;
renderAll();

// Debug / testing handle (also handy in the browser console)
window.__cb = { DOMAINS, state, validateData, buildInstructionModel, buildShoppingModel, instructionsText, shoppingText, bundleStatus, activeBundleId, applyPreset, setServings, servingScale, occScale };
</script>
